<!doctype html>
<html lang="ja">
  <head>
    <title>力と加速度の関係</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body class="h-full overflow-hidden bg-neutral-900 p-0">
    <bicpema-nav-bar></bicpema-nav-bar>

    <div
      class="relative mt-[60px] h-[calc(100vh-60px)] w-full overflow-hidden p-0"
      id="p5Container"
    >
      <div class="flex h-full w-full justify-center" id="p5Canvas"></div>

      <!-- モーダルパネル -->
      <bicpema-settings-modal
        id="settingsModal"
        variant="dark"
        panel-class="w-[340px] max-[576px]:w-[290px]"
      >
        <div class="mb-4">
          <label for="massInput" class="form-label">質量 m (kg)</label>
          <input
            type="number"
            class="form-control"
            id="massInput"
            min="0.5"
            max="5"
            value="1"
            step="0.5"
          />
        </div>
      </bicpema-settings-modal>

      <!-- 左下コントロール -->
      <div
        class="absolute bottom-5 left-5 z-[1000] flex flex-wrap gap-2.5 max-[576px]:bottom-2.5 max-[576px]:left-2.5 max-[576px]:gap-2"
      >
        <button
          id="resetButton"
          class="rounded-lg bg-blue-600 px-5 py-2.5 text-base font-bold whitespace-nowrap text-white shadow-[0_4px_6px_rgba(0,0,0,0.3)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 hover:bg-blue-500 hover:shadow-[0_6px_8px_rgba(0,0,0,0.4)] active:translate-y-0 active:shadow-[0_2px_4px_rgba(0,0,0,0.3)] max-[576px]:px-[15px] max-[576px]:py-2 max-[576px]:text-sm max-[400px]:px-3 max-[400px]:py-1.5 max-[400px]:text-xs"
        >
          リセット
        </button>
        <button
          id="clearMaxButton"
          class="ms-2 rounded-lg bg-neutral-600 px-5 py-2.5 text-base font-bold whitespace-nowrap text-white shadow-[0_4px_6px_rgba(0,0,0,0.3)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 hover:bg-neutral-500 hover:shadow-[0_6px_8px_rgba(0,0,0,0.4)] active:translate-y-0 active:shadow-[0_2px_4px_rgba(0,0,0,0.3)] max-[576px]:px-[15px] max-[576px]:py-2 max-[576px]:text-sm max-[400px]:px-3 max-[400px]:py-1.5 max-[400px]:text-xs"
        >
          最大値クリア
        </button>
      </div>

      <!-- 右上コントロール -->
      <bicpema-settings-button id="toggleModal"></bicpema-settings-button>
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にts/index.tsで非表示にします） -->
    <bicpema-loading-spinner></bicpema-loading-spinner>

    <script type="module" src="./ts/index.ts"></script>
  </body>
</html>
