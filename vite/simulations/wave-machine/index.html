<!doctype html>

<html lang="ja">
  <head>
    <title>ウェーブマシン</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body class="bg-neutral-900" oncontextmenu="return false;">
    <bicpema-nav-bar></bicpema-nav-bar>

    <div class="w-full p-0 mt-[60px]" id="p5Container">
      <div class="flex justify-center" id="p5Canvas"></div>

      <div class="absolute bottom-0 start-0 m-3">
        <button
          type="button"
          class="m-1 rounded bg-neutral-700 px-3 py-2 text-white hover:bg-neutral-600"
          id="decelerationButton"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            fill="currentColor"
            class="bi bi-skip-start-fill"
            viewBox="0 0 16 16"
          >
            <path
              d="M4 4a.5.5 0 0 1 1 0v3.248l6.267-3.636c.54-.313 1.232.066 1.232.696v7.384c0 .63-.692 1.01-1.232.697L5 8.753V12a.5.5 0 0 1-1 0V4z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="m-1 rounded bg-neutral-700 px-3 py-2 text-white hover:bg-neutral-600"
          id="accelerationButton"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            fill="currentColor"
            class="bi bi-skip-start-fill -scale-x-100"
            viewBox="0 0 16 16"
          >
            <path
              d="M4 4a.5.5 0 0 1 1 0v3.248l6.267-3.636c.54-.313 1.232.066 1.232.696v7.384c0 .63-.692 1.01-1.232.697L5 8.753V12a.5.5 0 0 1-1 0V4z"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にts/index.tsで非表示にします） -->
    <bicpema-loading-spinner></bicpema-loading-spinner>

    <script type="module" src="./ts/index.ts"></script>
  </body>
</html>
