<!doctype html>

<html lang="ja">
  <head>
    <title>ウェーブマシン</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body class="bg-neutral-900" oncontextmenu="return false;">
    <bicpema-nav-bar></bicpema-nav-bar>

    <div class="w-full p-0 mt-[60px]" id="p5Container">
      <div class="flex justify-center" id="p5Canvas"></div>

      <div class="absolute bottom-0 start-0 m-3">
        <button
          type="button"
          class="m-1 rounded bg-neutral-700 px-3 py-2 text-white hover:bg-neutral-600"
          id="decelerationButton"
          aria-label="波の速さを遅くする"
        >
          <bicpema-icon name="skip-start-fill" size="32"></bicpema-icon>
        </button>
        <button
          type="button"
          class="m-1 rounded bg-neutral-700 px-3 py-2 text-white hover:bg-neutral-600"
          id="accelerationButton"
          aria-label="波の速さを速くする"
        >
          <bicpema-icon
            name="skip-start-fill"
            size="32"
            class="-scale-x-100"
          ></bicpema-icon>
        </button>
      </div>
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にts/index.tsで非表示にします） -->
    <bicpema-loading-spinner></bicpema-loading-spinner>

    <script type="module" src="./ts/index.ts"></script>
  </body>
</html>
