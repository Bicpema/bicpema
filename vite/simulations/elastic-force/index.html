<!doctype html>
<html lang="ja">
  <head>
    <title>弾性力</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>

  <body class="bg-neutral-900">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">弾性力</span>
    </nav>

    <div class="w-full" id="p5Container">
      <div id="p5Canvas"></div>

      <!-- モーダルパネル -->
      <div id="settingsModal" class="settings-modal" style="display: none">
        <div class="modal-content">
          <h5>設定</h5>
          <div class="mb-4">
            <label for="springConstantInput" class="mb-2 block"
              >ばね定数 k (N/m)</label
            >
            <input
              type="range"
              class="w-full accent-blue-600"
              id="springConstantInput"
              min="5"
              max="100"
              value="20"
              step="5"
            />
            <div class="flex justify-between">
              <small class="text-white/50">5 N/m</small>
              <span id="springConstantDisplay" class="font-bold text-white"
                >20 N/m</span
              >
              <small class="text-white/50">100 N/m</small>
            </div>
          </div>
          <button id="resetButton" class="mb-2 w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500">
            リセット
          </button>
          <button id="closeModal" class="w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500">
            閉じる
          </button>
        </div>
      </div>

      <!-- 右上コントロール -->
      <div class="right-top-controls">
        <button id="toggleModal" class="bg-cyan-600 text-white hover:bg-cyan-500">設定</button>
      </div>
    </div>
    <script type="module" src="./js/index.js"></script>
  </body>
</html>
