<!doctype html>
<html lang="ja">
  <head>
    <title>力学台車が定規にする仕事</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>

  <body class="bg-neutral-900">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">力学台車が定規にする仕事</span>
    </nav>

    <div class="w-full" id="p5Container">
      <div id="p5Canvas"></div>

      <!-- 情報パネル（HTML 表示） -->
      <div
        id="infoPanel"
        class="info-panel"
        role="region"
        aria-label="情報パネル"
      >
        <div class="info-row">
          <span class="label">質量 m = </span
          ><span id="info-mass" class="value">0.5 kg</span>
        </div>
        <div class="info-row">
          <span class="label">初速度 v₀ = </span
          ><span id="info-v0" class="value">2.0 m/s</span>
        </div>
        <div class="info-row">
          <span class="label">抵抗力 F = </span
          ><span id="info-F" class="value">5 N</span>
        </div>
        <hr />
        <div class="info-row">
          <span class="label">初期運動エネルギー KE₀ = </span
          ><span id="info-ke0" class="value">0.000 J</span>
        </div>
        <div class="info-row">
          <span class="label">めり込み距離 d = </span
          ><span id="info-d" class="value">0.000 m</span>
        </div>
        <div class="info-row">
          <span class="label">仕事 W = </span
          ><span id="info-W" class="value">0.000 J</span>
        </div>
        <div id="info-status" class="info-status">
          現在の運動エネルギー = 0.000 J
        </div>
      </div>

      <!-- 設定モーダル -->
      <div id="settingsModal" class="settings-modal" style="display: none">
        <div class="modal-content-inner">
          <h5>設定</h5>
          <div class="mb-3">
            <label for="massInput" class="mb-2 block">台車の質量 m (kg)</label>
            <input
              type="number"
              class="block w-full rounded border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900"
              id="massInput"
              min="0.1"
              max="2.0"
              step="0.1"
              value="0.5"
            />
          </div>
          <div class="mb-3">
            <label for="velocityInput" class="mb-2 block"
              >初速度 v₀ (m/s)</label
            >
            <input
              type="number"
              class="block w-full rounded border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900"
              id="velocityInput"
              min="0.5"
              max="3.0"
              step="0.5"
              value="2.0"
            />
          </div>
          <div class="mb-3">
            <label for="forceInput" class="mb-2 block">抵抗力 F (N)</label>
            <input
              type="number"
              class="block w-full rounded border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900"
              id="forceInput"
              min="1"
              max="50"
              step="1"
              value="5"
            />
          </div>
          <button id="closeModal" class="w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500">
            閉じる
          </button>
        </div>
      </div>

      <!-- 左下コントロール -->
      <div class="left-bottom-controls">
        <button id="resetButton" class="bg-blue-600 text-white hover:bg-blue-500">🔄 リセット</button>
        <button id="playPauseButton" class="bg-green-600 text-white hover:bg-green-500">▶ 開始</button>
      </div>

      <!-- 右上コントロール -->
      <div class="right-top-controls">
        <button id="toggleModal" class="bg-cyan-600 text-white hover:bg-cyan-500">⚙ 設定</button>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
