<!doctype html>
<html lang="ja">
  <head>
    <title>3力の釣り合い</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>

  <body class="bg-neutral-900" oncontextmenu="return false;">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">3力の釣り合い</span>
    </nav>

    <div class="w-full" id="p5Container">
      <div id="p5Canvas"></div>

      <!-- 設定パネル -->
      <div id="settingsModal" class="settings-modal" style="display: none">
        <div class="settings-content">
          <h5>設定</h5>
          <div class="mb-4">
            <label for="weightInput" class="mb-2 block">
              おもりの重さ W:
              <span id="weightDisplay">20</span> N
            </label>
            <input
              type="range"
              class="w-full accent-blue-600"
              id="weightInput"
              min="5"
              max="50"
              step="1"
              value="20"
            />
            <div class="flex justify-between">
              <small class="text-white/50">5 N</small>
              <small class="text-white/50">50 N</small>
            </div>
          </div>
          <button id="resetButton" class="mb-2 w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500">
            リセット
          </button>
          <button id="closeModal" class="w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500">
            閉じる
          </button>
        </div>
      </div>

      <!-- 右上コントロール -->
      <div class="right-top-controls">
        <button id="toggleModal" class="bg-cyan-600 text-white hover:bg-cyan-500">⚙ 設定</button>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
