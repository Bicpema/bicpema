<!doctype html>
<html lang="ja">
  <head>
    <title>3力の釣り合い</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body
    class="h-full overflow-hidden bg-neutral-900 p-0"
    oncontextmenu="return false;"
  >
    <bicpema-nav-bar></bicpema-nav-bar>

    <div
      class="relative mt-[60px] h-[calc(100vh-60px)] w-full overflow-hidden p-0"
      id="p5Container"
    >
      <div class="flex h-full w-full justify-center" id="p5Canvas"></div>

      <!-- 設定パネル -->
      <bicpema-settings-modal
        id="settingsModal"
        variant="dark"
        panel-class="w-[340px] max-[576px]:w-[290px]"
      >
        <div class="mb-4">
          <label for="weightInput" class="form-label">
            おもりの重さ W:
            <span id="weightDisplay">20</span> N
          </label>
          <input
            type="range"
            class="w-full accent-blue-600"
            id="weightInput"
            min="5"
            max="50"
            step="1"
            value="20"
          />
          <div class="flex justify-between">
            <small class="text-white/50">5 N</small>
            <small class="text-white/50">50 N</small>
          </div>
        </div>
        <button
          id="resetButton"
          class="mb-2 w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500"
        >
          リセット
        </button>
      </bicpema-settings-modal>

      <!-- 右上コントロール -->
      <bicpema-settings-button id="toggleModal"></bicpema-settings-button>
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にts/index.tsで非表示にします） -->
    <bicpema-loading-spinner></bicpema-loading-spinner>

    <script type="module" src="./ts/index.ts"></script>
  </body>
</html>
