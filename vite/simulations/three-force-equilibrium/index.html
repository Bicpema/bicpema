<!doctype html>
<html lang="ja">
  <head>
    <title>3力の釣り合い</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body class="h-full overflow-hidden bg-neutral-900 p-0" oncontextmenu="return false;">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">3力の釣り合い</span>
    </nav>

    <div class="relative mt-[60px] h-[calc(100vh-60px)] w-full overflow-hidden p-0" id="p5Container">
      <div class="flex h-full w-full justify-center" id="p5Canvas"></div>

      <!-- 設定パネル -->
      <div
        id="settingsModal"
        class="absolute top-1/2 left-1/2 z-[2000] w-[340px] max-w-[90vw] -translate-x-1/2 -translate-y-1/2 rounded-xl border-2 border-white/30 bg-black/90 p-[30px] text-white shadow-[0_8px_32px_rgba(0,0,0,0.5)] backdrop-blur-[15px] max-[576px]:w-[290px] max-[576px]:p-5"
        style="display: none"
      >
        <div>
          <h5 class="mb-5 text-center text-[1.1rem] text-white">設定</h5>
          <div class="mb-4">
            <label for="weightInput" class="mb-2 block">
              おもりの重さ W:
              <span id="weightDisplay">20</span> N
            </label>
            <input
              type="range"
              class="w-full accent-blue-600"
              id="weightInput"
              min="5"
              max="50"
              step="1"
              value="20"
            />
            <div class="flex justify-between">
              <small class="text-white/50">5 N</small>
              <small class="text-white/50">50 N</small>
            </div>
          </div>
          <button id="resetButton" class="mb-2 w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500">
            リセット
          </button>
          <button id="closeModal" class="w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500">
            閉じる
          </button>
        </div>
      </div>

      <!-- 右上コントロール -->
      <div class="absolute top-5 right-5 z-[1000] max-[576px]:top-2.5 max-[576px]:right-2.5">
        <button
          id="toggleModal"
          class="rounded-lg bg-cyan-600 px-5 py-2.5 text-[15px] font-bold whitespace-nowrap text-white shadow-[0_4px_6px_rgba(0,0,0,0.3)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 hover:bg-cyan-500 hover:shadow-[0_6px_8px_rgba(0,0,0,0.4)] active:translate-y-0 active:shadow-[0_2px_4px_rgba(0,0,0,0.3)] max-[576px]:px-3.5 max-[576px]:py-[7px] max-[576px]:text-[13px]"
        >
          ⚙ 設定
        </button>
      </div>
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にjs/index.jsで非表示にします） -->
    <div
      id="loadingSpinner"
      class="fixed inset-0 z-[2000] flex items-center justify-center bg-neutral-900"
      role="status"
      aria-live="polite"
      aria-label="読み込み中"
    >
      <div class="h-12 w-12 animate-spin rounded-full border-4 border-neutral-600 border-t-blue-500"></div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
