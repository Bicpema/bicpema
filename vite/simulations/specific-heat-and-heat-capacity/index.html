<!doctype html>
<html lang="ja">
  <head>
    <title>比熱と熱容量</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body class="h-full overflow-hidden bg-neutral-900 p-0">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a
        class="font-semibold text-white no-underline"
        href="https://bicpema.com/"
        >Bicpema</a
      >
      <span class="ml-3 font-light text-neutral-300">比熱と熱容量</span>
    </nav>

    <div
      class="relative mt-[60px] h-[calc(100vh-60px)] w-full overflow-hidden p-0"
      id="p5Container"
    >
      <div class="flex h-full w-full justify-center" id="p5Canvas"></div>

      <!-- 設定モーダル -->
      <div
        id="settingsModal"
        class="modal-panel hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[340px] max-[576px]:w-[290px]"
        role="dialog"
        aria-modal="true"
        aria-label="設定"
      >
        <div>
          <h5 class="mb-5 text-center text-white">設定</h5>
          <div class="mb-4">
            <label for="materialSelectA" class="form-label">物質A</label>
            <select class="form-control" id="materialSelectA">
              <option value="0">アルミニウム</option>
              <option value="1">鉄</option>
              <option value="2">銅</option>
              <option value="3">銀</option>
              <option value="4">水銀</option>
            </select>
          </div>
          <div class="mb-4">
            <label for="massSelectA" class="form-label">物質Aの質量</label>
            <select class="form-control" id="massSelectA">
              <option value="1" selected>質量(小) 0.1kg</option>
              <option value="0">質量(大) 0.3kg</option>
            </select>
          </div>
          <div class="mb-4">
            <label for="materialSelectB" class="form-label">物質B</label>
            <select class="form-control" id="materialSelectB">
              <option value="0">アルミニウム</option>
              <option value="1">鉄</option>
              <option value="2">銅</option>
              <option value="3">銀</option>
              <option value="4">水銀</option>
            </select>
          </div>
          <div class="mb-4">
            <label for="massSelectB" class="form-label">物質Bの質量</label>
            <select class="form-control" id="massSelectB">
              <option value="0" selected>質量(大) 0.3kg</option>
              <option value="1">質量(小) 0.1kg</option>
            </select>
          </div>
          <button id="closeModal" class="modal-close modal-close-solid">
            閉じる
          </button>
        </div>
      </div>

      <!-- 右上コントロール -->
      <div
        class="absolute top-5 right-5 z-[1000] max-[576px]:top-2.5 max-[576px]:right-2.5"
      >
        <button
          id="toggleModal"
          class="settings-modal-open btn-settings-modal-open"
          aria-label="シミュレーションの設定"
        >
          ⚙ 設定
        </button>
      </div>
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にjs/index.jsで非表示にします） -->
    <div
      id="loadingSpinner"
      class="fixed inset-0 z-[2000] flex items-center justify-center bg-neutral-900"
      role="status"
      aria-live="polite"
      aria-label="読み込み中"
    >
      <div
        class="h-12 w-12 animate-spin rounded-full border-4 border-neutral-600 border-t-blue-500"
      ></div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
