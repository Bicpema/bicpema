<!doctype html>
<html lang="ja">
  <head>
    <title>比熱と熱容量</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body class="h-full overflow-hidden bg-neutral-900 p-0">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">比熱と熱容量</span>
    </nav>

    <div class="relative mt-[60px] h-[calc(100vh-60px)] w-full overflow-hidden p-0" id="p5Container">
      <div class="flex h-full w-full justify-center" id="p5Canvas"></div>

      <!-- 設定モーダル -->
      <div
        id="settingsModal"
        class="absolute top-1/2 left-1/2 z-[2000] w-[340px] max-w-[90vw] -translate-x-1/2 -translate-y-1/2 rounded-xl border-2 border-white/30 bg-black/90 p-[30px] text-white shadow-[0_8px_32px_rgba(0,0,0,0.5)] backdrop-blur-[15px] max-[576px]:w-[290px] max-[576px]:p-5"
        style="display: none"
      >
        <div>
          <h5 class="mb-5 text-center text-white">設定</h5>
          <div class="mb-4">
            <label for="materialSelectA" class="mb-2 block">物質A</label>
            <select class="block w-full rounded border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900" id="materialSelectA">
              <option value="0">アルミニウム</option>
              <option value="1">鉄</option>
              <option value="2">銅</option>
              <option value="3">銀</option>
              <option value="4">水銀</option>
            </select>
          </div>
          <div class="mb-4">
            <label for="massSelectA" class="mb-2 block">物質Aの質量</label>
            <select class="block w-full rounded border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900" id="massSelectA">
              <option value="1" selected>質量(小) 0.1kg</option>
              <option value="0">質量(大) 0.3kg</option>
            </select>
          </div>
          <div class="mb-4">
            <label for="materialSelectB" class="mb-2 block">物質B</label>
            <select class="block w-full rounded border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900" id="materialSelectB">
              <option value="0">アルミニウム</option>
              <option value="1">鉄</option>
              <option value="2">銅</option>
              <option value="3">銀</option>
              <option value="4">水銀</option>
            </select>
          </div>
          <div class="mb-4">
            <label for="massSelectB" class="mb-2 block">物質Bの質量</label>
            <select class="block w-full rounded border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900" id="massSelectB">
              <option value="0" selected>質量(大) 0.3kg</option>
              <option value="1">質量(小) 0.1kg</option>
            </select>
          </div>
          <button id="closeModal" class="w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500">
            閉じる
          </button>
        </div>
      </div>

      <!-- 右上コントロール -->
      <div class="absolute top-5 right-5 z-[1000] max-[576px]:top-2.5 max-[576px]:right-2.5">
        <button
          id="toggleModal"
          class="rounded-lg bg-cyan-600 px-5 py-2.5 text-base font-bold whitespace-nowrap text-white shadow-[0_4px_6px_rgba(0,0,0,0.3)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 hover:bg-cyan-500 hover:shadow-[0_6px_8px_rgba(0,0,0,0.4)] active:translate-y-0 active:shadow-[0_2px_4px_rgba(0,0,0,0.3)] max-[576px]:px-[15px] max-[576px]:py-2 max-[576px]:text-sm max-[400px]:px-3 max-[400px]:py-1.5 max-[400px]:text-xs"
        >
          ⚙ 設定
        </button>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
