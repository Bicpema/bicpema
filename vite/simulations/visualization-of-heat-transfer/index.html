<!doctype html>
<html lang="ja">
  <head>
    <title>熱の移動</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>

  <body class="bg-neutral-900">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">熱の移動</span>
    </nav>

    <div class="w-full" id="p5Container">
      <div id="p5Canvas"></div>
    </div>

    <!-- 上部設定パネル -->
    <div
      class="absolute start-0 m-3 rounded p-3"
      style="top: 4.5rem; background: rgba(255, 255, 255, 0.9); z-index: 1000"
    >
      <div class="mb-1 flex items-center gap-2">
        <input
          class="h-4 w-4 accent-blue-600"
          type="radio"
          name="contact"
          id="contactYes"
          value="0"
        />
        <label class="text-sm" for="contactYes"
          >接触させる<br /><small>(※ただし同質量, 同物質)</small></label
        >
      </div>
      <div class="flex items-center gap-2">
        <input
          class="h-4 w-4 accent-blue-600"
          type="radio"
          name="contact"
          id="contactNo"
          value="1"
          checked
        />
        <label class="text-sm" for="contactNo">接触前に戻す</label>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
