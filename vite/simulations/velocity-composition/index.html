<!doctype html>
<html lang="ja">
  <head>
    <title>速度の合成</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>

  <body class="bg-neutral-900" oncontextmenu="return false;">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">速度の合成</span>
    </nav>

    <div class="w-full" id="p5Container">
      <div id="p5Canvas"></div>

      <!-- 設定パネル -->
      <div id="settingsModal" class="settings-modal" style="display: none">
        <div class="settings-content">
          <h5>設定</h5>
          <div class="mb-3">
            <label for="riverSpeedInput" class="mb-2 block">
              川の速度（左向き固定）:
              <span id="riverSpeedValue">3.0</span> m/s
            </label>
            <input
              type="range"
              class="w-full accent-blue-600"
              id="riverSpeedInput"
              min="0"
              max="10"
              step="0.5"
              value="3"
            />
          </div>
          <div class="mb-3">
            <label for="boatSpeedInput" class="mb-2 block"
              >船の速度（水に対して）:</label
            >
            <div id="boatSpeedValue" class="speed-label">5.0 m/s ← 下流</div>
            <input
              type="range"
              class="w-full accent-blue-600"
              id="boatSpeedInput"
              min="-10"
              max="10"
              step="0.5"
              value="5"
            />
            <small class="text-neutral-400"
              >← 下流方向（+）/ → 上流方向（−）</small
            >
          </div>
          <button id="closeModal" class="mt-2 w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500">
            閉じる
          </button>
        </div>
      </div>

      <!-- 左下コントロール -->
      <div class="left-bottom-controls">
        <button id="resetButton" class="bg-blue-600 text-white hover:bg-blue-500">リセット</button>
        <button id="playPauseButton" class="bg-green-600 text-white hover:bg-green-500">開始</button>
      </div>

      <!-- 右上コントロール -->
      <div class="right-top-controls">
        <button id="toggleModal" class="bg-cyan-600 text-white hover:bg-cyan-500">⚙ 設定</button>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
