<!doctype html>

<html lang="ja">
  <head>
    <title>セロハンによる色を変化を観察するシミュレーション</title>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link rel="stylesheet" href="./css/style.css" type="text/css" />
  </head>

  <body class="bg-neutral-900" oncontextmenu="return false;">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">偏光色を再現するシミュレーション</span>
    </nav>
    <div id="p5Container">
      <div class="flex w-full m-0">
        <div class="flex-1 p-0 content-box">
          <div class="" id="p5Canvas"></div>
        </div>
      </div>
    <!-- Button trigger modal -->
    <div class="absolute bottom-0 m-3 start-0">
      <button
        type="button"
        class="settings-modal-open rounded bg-blue-600 px-3 py-2 text-white hover:bg-blue-500"
      >
        シミュレーションの設定
      </button>
      <a class="inline-flex items-center gap-1.5 rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500" id="screenshotButton" type="button">
        スクリーンショット
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20px"
          height="20px"
          fill="currentColor"
          class="bi bi-camera pb-1"
          viewBox="0 0 16 16"
        >
          <path
            d="M15 12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h1.172a3 3 0 0 0 2.12-.879l.83-.828A1 1 0 0 1 6.827 3h2.344a1 1 0 0 1 .707.293l.828.828A3 3 0 0 0 12.828 5H14a1 1 0 0 1 1 1v6zM2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4H2z"
          />
          <path
            d="M8 11a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5zm0 1a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM3 6.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0z"
          />
        </svg>
      </a>
    </div>
    <!-- Modal -->
    <div
      class="fixed inset-0 z-[1100] hidden flex items-center justify-center bg-black/50"
      id="settingModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingModalTitle"
    >
      <div class="max-h-[85vh] w-full max-w-2xl overflow-y-auto rounded bg-white p-4 text-neutral-900">
        <div class="mb-3 flex items-center justify-between border-b border-neutral-200 pb-2">
          <h1 class="text-xl font-semibold" id="settingModalTitle">
            シミュレーションの設定
          </h1>
          <button
            type="button"
            class="modal-close text-xl leading-none text-neutral-500 hover:text-neutral-700"
            aria-label="Close"
          >
            &times;
          </button>
        </div>
        <div>
          <h2 class="text-lg font-semibold">偏光板とセロハンテープの設定</h2>
          <div class="mb-4">
            <select class="block w-full rounded border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900" id="polarizerSelect">
              <option>平行ニコル配置</option>
              <option>直交ニコル配置</option>
            </select>
            <label class="mt-1 block text-sm text-neutral-600" for="polarizerSelect"
              >偏光板の重ね方を選択してください。</label
            >
          </div>
          <div class="mb-4">
            <input
              type="number"
              class="block w-full rounded border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900"
              id="opdInput"
              placeholder=""
              min="0"
              value="250.00"
            />
            <label class="mt-1 block text-sm text-neutral-600" for="opdInput">光路差の値を入力してください。</label>
          </div>

          <h2 class="text-lg font-semibold">セロハンテープの組の設定</h2>
          <button
            class="mb-3 rounded border border-blue-600 bg-white px-3 py-1.5 text-blue-600 hover:bg-blue-50"
            id="cellophaneAddButton"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20px"
              height="20px"
              fill="currentColor"
              class="bi bi-plus-circle pb-1"
              viewBox="0 0 16 16"
            >
              <path
                d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"
              />
              <path
                d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"
              />
            </svg>
            追加
          </button>
          <button
            class="mb-3 rounded border border-red-600 bg-white px-3 py-1.5 text-red-600 hover:bg-red-50"
            id="cellophaneRemoveButton"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20px"
              height="20px"
              fill="currentColor"
              class="bi bi-dash-circle pb-1"
              viewBox="0 0 16 16"
            >
              <path
                d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"
              />
              <path
                d="M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8z"
              />
            </svg>
            削除
          </button>
          <div class="mb-3 overflow-auto" id="cellophaneColabNum"></div>
          <div class="flex justify-end border-t border-neutral-200 pt-2">
            <button
              type="button"
              class="modal-close rounded border border-neutral-400 px-3 py-1.5 hover:bg-neutral-100"
            >
              閉じる
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- {simulation name}.js -->
    <script type="module" src="./js/index.js"></script>
  </body>
</html>
