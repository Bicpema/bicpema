<!doctype html>
<html lang="ja">
  <head>
    <title>アルキメデスの原理</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body class="bg-neutral-900">
    <bicpema-nav-bar></bicpema-nav-bar>

    <div class="w-full p-0 mt-[60px]" id="p5Container">
      <div class="flex justify-center" id="p5Canvas"></div>

      <!-- 設定パネル -->
      <div
        class="absolute end-0 m-4 hidden w-full rounded-lg border border-neutral-300 bg-white shadow-lg sm:w-5/12 lg:w-1/4"
        id="settingsPanel"
        style="top: 60px"
      >
        <div class="p-4">
          <h6 class="mb-3 text-base font-semibold">設定</h6>
          <div class="mb-4">
            <label for="densitySlider" class="form-label"
              >円柱の密度: <span id="densityValue">1.0</span> g/cm³</label
            >
            <input
              type="range"
              class="w-full accent-blue-600"
              id="densitySlider"
              min="0.1"
              max="2.0"
              step="0.05"
              value="1.0"
            />
          </div>
          <div class="mb-1 text-neutral-500" style="font-size: 0.85em">
            水の密度: 1.0 g/cm³
          </div>
          <div
            class="mb-1 text-neutral-500"
            id="submergedRatioLabel"
            style="font-size: 0.85em"
          >
            水中体積比: 100%
          </div>
        </div>
      </div>
    </div>

    <!-- 下部ボタン -->
    <div class="absolute bottom-0 start-0 m-2 flex gap-2">
      <button
        type="button"
        class="rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500"
        id="resetButton"
      >
        🔄 リセット
      </button>
    </div>

    <!-- 右上の設定ボタン -->
    <div class="absolute top-0 end-0 m-2" style="margin-top: 60px !important">
      <button
        type="button"
        class="btn-settings-modal-open"
        id="settingsButton"
        aria-expanded="false"
      >
        ⚙ 設定
      </button>
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にts/index.tsで非表示にします） -->
    <bicpema-loading-spinner></bicpema-loading-spinner>

    <script type="module" src="./ts/index.ts"></script>
  </body>
</html>
