<!doctype html>
<html lang="ja">
  <head>
    <title>斜面をくだる力学台車の運動</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>

  <body class="bg-neutral-900">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">斜面をくだる力学台車の運動</span>
    </nav>

    <div class="w-full" id="p5Container">
      <div id="p5Canvas"></div>

      <!-- モーダルパネル -->
      <div id="settingsModal" class="settings-modal" style="display: none">
        <div class="modal-content-inner">
          <h5>設定</h5>
          <div class="mb-3">
            <label for="angleInput" class="mb-2 block">斜面の角度 (°)</label>
            <input
              type="number"
              class="block w-full rounded border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900"
              id="angleInput"
              min="0"
              max="30"
              value="20"
              step="1"
            />
          </div>
          <div class="mb-3">
            <label for="intervalInput" class="mb-2 block">記録間隔 (s)</label>
            <select class="block w-full rounded border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900" id="intervalInput">
              <option value="0.05">0.05 s</option>
              <option value="0.1" selected>0.1 s</option>
              <option value="0.2">0.2 s</option>
            </select>
          </div>
          <button id="closeModal" class="w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500">
            閉じる
          </button>
        </div>
      </div>

      <!-- 左下コントロール -->
      <div class="left-bottom-controls">
        <button id="resetButton" class="bg-blue-600 text-white hover:bg-blue-500">🔄 リセット</button>
        <button id="playPauseButton" class="bg-green-600 text-white hover:bg-green-500">▶ 開始</button>
      </div>

      <!-- 右上コントロール -->
      <div class="right-top-controls">
        <button id="toggleModal" class="bg-cyan-600 text-white hover:bg-cyan-500">⚙ 設定</button>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
