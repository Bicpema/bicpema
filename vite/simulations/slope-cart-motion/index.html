<!doctype html>
<html lang="ja">
  <head>
    <title>斜面をくだる力学台車の運動</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body class="overflow-x-hidden bg-neutral-900 m-0 p-0">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">斜面をくだる力学台車の運動</span>
    </nav>

    <div class="relative w-full mt-[60px] p-0" id="p5Container">
      <div class="flex justify-center" id="p5Canvas"></div>

      <!-- モーダルパネル -->
      <div
        id="settingsModal"
        class="absolute top-1/2 left-1/2 z-[2000] w-[350px] max-w-[90vw] -translate-x-1/2 -translate-y-1/2 rounded-xl border-2 border-white/30 bg-black/90 p-[30px] text-white shadow-[0_8px_32px_rgba(0,0,0,0.5)] backdrop-blur-[15px]"
        style="display: none"
      >
        <div>
          <h5 class="mb-5 text-center text-white">設定</h5>
          <div class="mb-3">
            <label for="angleInput" class="mb-2 block">斜面の角度 (°)</label>
            <input
              type="number"
              class="block w-full rounded border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900"
              id="angleInput"
              min="0"
              max="30"
              value="20"
              step="1"
            />
          </div>
          <div class="mb-3">
            <label for="intervalInput" class="mb-2 block">記録間隔 (s)</label>
            <select class="block w-full rounded border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900" id="intervalInput">
              <option value="0.05">0.05 s</option>
              <option value="0.1" selected>0.1 s</option>
              <option value="0.2">0.2 s</option>
            </select>
          </div>
          <button id="closeModal" class="w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500">
            閉じる
          </button>
        </div>
      </div>

      <!-- 左下コントロール -->
      <div
        class="absolute bottom-5 left-5 z-[1000] flex flex-wrap gap-2.5 max-[576px]:bottom-2.5 max-[576px]:left-2.5 max-[576px]:gap-2"
      >
        <button
          id="resetButton"
          class="rounded-lg bg-blue-600 px-5 py-2.5 text-base font-bold whitespace-nowrap text-white shadow-[0_4px_6px_rgba(0,0,0,0.3)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 hover:bg-blue-500 hover:shadow-[0_6px_8px_rgba(0,0,0,0.4)] max-[576px]:px-[15px] max-[576px]:py-2 max-[576px]:text-sm"
        >
          🔄 リセット
        </button>
        <button
          id="playPauseButton"
          class="rounded-lg bg-green-600 px-5 py-2.5 text-base font-bold whitespace-nowrap text-white shadow-[0_4px_6px_rgba(0,0,0,0.3)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 hover:bg-green-500 hover:shadow-[0_6px_8px_rgba(0,0,0,0.4)] max-[576px]:px-[15px] max-[576px]:py-2 max-[576px]:text-sm"
        >
          ▶ 開始
        </button>
      </div>

      <!-- 右上コントロール -->
      <div class="absolute top-5 right-5 z-[1000] max-[576px]:top-2.5 max-[576px]:right-2.5">
        <button
          id="toggleModal"
          class="rounded-lg bg-cyan-600 px-5 py-2.5 text-base font-bold whitespace-nowrap text-white shadow-[0_4px_6px_rgba(0,0,0,0.3)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 hover:bg-cyan-500 hover:shadow-[0_6px_8px_rgba(0,0,0,0.4)] max-[576px]:px-[15px] max-[576px]:py-2 max-[576px]:text-sm"
        >
          ⚙ 設定
        </button>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
