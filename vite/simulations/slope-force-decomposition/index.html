<!doctype html>
<html lang="ja">
  <head>
    <title>斜面の力の分解</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body
    class="h-full overflow-hidden bg-neutral-900 p-0"
    oncontextmenu="return false;"
  >
    <bicpema-nav-bar></bicpema-nav-bar>

    <div
      class="relative mt-[60px] h-[calc(100vh-60px)] w-full overflow-hidden p-0"
      id="p5Container"
    >
      <div class="flex h-full w-full justify-center" id="p5Canvas"></div>

      <!-- 設定パネル -->
      <bicpema-settings-modal
        id="settingsModal"
        variant="dark"
        panel-class="w-[400px]"
      >
        <div class="mb-4">
          <label class="form-label">
            質量: <span id="massValue">10 kg</span>
          </label>
          <input
            type="range"
            class="w-full accent-blue-600"
            id="massInput"
            min="1"
            max="30"
            step="1"
            value="10"
          />
        </div>
        <div class="mb-4">
          <label class="form-label">
            斜面の角度: <span id="slopeAngleValue">30°</span>
          </label>
          <input
            type="range"
            class="w-full accent-blue-600"
            id="slopeAngleInput"
            min="0"
            max="80"
            step="1"
            value="30"
          />
        </div>
      </bicpema-settings-modal>

      <!-- 右上コントロール -->
      <bicpema-settings-button id="toggleModal"></bicpema-settings-button>
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にts/index.tsで非表示にします） -->
    <bicpema-loading-spinner></bicpema-loading-spinner>

    <script type="module" src="./ts/index.ts"></script>
  </body>
</html>
