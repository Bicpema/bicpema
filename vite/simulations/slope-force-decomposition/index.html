<!doctype html>
<html lang="ja">
  <head>
    <title>斜面の力の分解</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body class="h-full overflow-hidden bg-neutral-900 p-0" oncontextmenu="return false;">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">斜面の力の分解</span>
    </nav>

    <div class="relative mt-[60px] h-[calc(100vh-60px)] w-full overflow-hidden p-0" id="p5Container">
      <div class="flex h-full w-full justify-center" id="p5Canvas"></div>

      <!-- 設定パネル -->
      <div
        id="settingsModal"
        class="absolute top-0 right-5 z-[2000] w-[400px] max-w-[90vw] rounded-xl border-2 border-white/30 bg-black/90 p-[30px] text-white shadow-[0_8px_32px_rgba(0,0,0,0.5)] backdrop-blur-[15px] max-[576px]:w-[300px] max-[576px]:p-5"
        style="display: none"
      >
        <div>
          <h5 class="mb-5 text-center text-[1.2rem] text-white">シミュレーションの設定</h5>

          <div class="mb-4">
            <label class="mb-2 block">
              質量: <span id="massValue">10 kg</span>
            </label>
            <input
              type="range"
              class="w-full accent-blue-600"
              id="massInput"
              min="1"
              max="30"
              step="1"
              value="10"
            />
          </div>
          <div class="mb-4">
            <label class="mb-2 block">
              斜面の角度: <span id="slopeAngleValue">30°</span>
            </label>
            <input
              type="range"
              class="w-full accent-blue-600"
              id="slopeAngleInput"
              min="0"
              max="80"
              step="1"
              value="30"
            />
          </div>

          <button id="closeModal" class="mt-2 w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500">
            閉じる
          </button>
        </div>
      </div>

      <!-- 右上コントロール -->
      <div class="absolute top-5 right-5 z-[1000] max-[576px]:top-2.5 max-[576px]:right-2.5" id="rightTopControls">
        <button
          id="toggleModal"
          class="rounded-lg bg-cyan-600 px-5 py-2.5 text-base font-bold whitespace-nowrap text-white shadow-[0_4px_6px_rgba(0,0,0,0.3)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 hover:bg-cyan-500 hover:shadow-[0_6px_8px_rgba(0,0,0,0.4)] active:translate-y-0 active:shadow-[0_2px_4px_rgba(0,0,0,0.3)] max-[576px]:px-3.5 max-[576px]:py-2 max-[576px]:text-[13px] max-[400px]:px-2.5 max-[400px]:py-1.5 max-[400px]:text-[11px]"
        >
          ⚙ 設定
        </button>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
