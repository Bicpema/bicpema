<!doctype html>
<html lang="ja">
  <head>
    <title>斜面の力の分解</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body
    class="h-full overflow-hidden bg-neutral-900 p-0"
    oncontextmenu="return false;"
  >
    <bicpema-nav-bar></bicpema-nav-bar>

    <div
      class="relative mt-[60px] h-[calc(100vh-60px)] w-full overflow-hidden p-0"
      id="p5Container"
    >
      <div class="flex h-full w-full justify-center" id="p5Canvas"></div>

      <!-- 設定パネル -->
      <div
        id="settingsModal"
        class="modal-panel hidden absolute top-0 right-5 w-[400px]"
        role="dialog"
        aria-modal="true"
        aria-label="シミュレーションの設定"
      >
        <div>
          <h5 class="mb-5 text-center text-[1.2rem] text-white">
            シミュレーションの設定
          </h5>

          <div class="mb-4">
            <label class="form-label">
              質量: <span id="massValue">10 kg</span>
            </label>
            <input
              type="range"
              class="w-full accent-blue-600"
              id="massInput"
              min="1"
              max="30"
              step="1"
              value="10"
            />
          </div>
          <div class="mb-4">
            <label class="form-label">
              斜面の角度: <span id="slopeAngleValue">30°</span>
            </label>
            <input
              type="range"
              class="w-full accent-blue-600"
              id="slopeAngleInput"
              min="0"
              max="80"
              step="1"
              value="30"
            />
          </div>

          <button id="closeModal" class="modal-close modal-close-solid mt-2">
            閉じる
          </button>
        </div>
      </div>

      <!-- 右上コントロール -->
      <div
        class="absolute top-5 right-5 z-[1000] max-[576px]:top-2.5 max-[576px]:right-2.5"
        id="rightTopControls"
      >
        <button
          id="toggleModal"
          class="settings-modal-open btn-settings-modal-open max-[576px]:px-3.5 max-[576px]:py-2 max-[576px]:text-[13px] max-[400px]:px-2.5 max-[400px]:py-1.5 max-[400px]:text-[11px]"
          aria-label="シミュレーションの設定"
        >
          ⚙ 設定
        </button>
      </div>
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にts/index.tsで非表示にします） -->
    <bicpema-loading-spinner></bicpema-loading-spinner>

    <script type="module" src="./ts/index.ts"></script>
  </body>
</html>
