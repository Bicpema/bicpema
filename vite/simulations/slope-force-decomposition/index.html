<!doctype html>
<html lang="ja">
  <head>
    <title>斜面の力の分解</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>

  <body class="bg-neutral-900" oncontextmenu="return false;">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">斜面の力の分解</span>
    </nav>

    <div class="w-full" id="p5Container">
      <div id="p5Canvas"></div>

      <!-- 設定パネル -->
      <div id="settingsModal" class="settings-modal" style="display: none">
        <div class="settings-content">
          <h5>シミュレーションの設定</h5>

          <div class="mb-4">
            <label class="mb-2 block">
              質量: <span id="massValue">10 kg</span>
            </label>
            <input
              type="range"
              class="w-full accent-blue-600"
              id="massInput"
              min="1"
              max="30"
              step="1"
              value="10"
            />
          </div>
          <div class="mb-4">
            <label class="mb-2 block">
              斜面の角度: <span id="slopeAngleValue">30°</span>
            </label>
            <input
              type="range"
              class="w-full accent-blue-600"
              id="slopeAngleInput"
              min="0"
              max="80"
              step="1"
              value="30"
            />
          </div>

          <button id="closeModal" class="mt-2 w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500">
            閉じる
          </button>
        </div>
      </div>

      <!-- 右上コントロール -->
      <div class="right-top-controls" id="rightTopControls">
        <button id="toggleModal" class="bg-cyan-600 text-white hover:bg-cyan-500">⚙ 設定</button>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
