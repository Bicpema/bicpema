<!doctype html>
<html lang="ja">
  <head>
    <title>空気柱の共鳴</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body class="bg-neutral-900" oncontextmenu="return false;">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">空気柱の共鳴</span>
    </nav>
    <div class="w-full p-0 mt-[60px]" id="p5Container">
      <div class="relative flex justify-center" id="p5Canvas">
        <div
          class="absolute end-0 m-2"
          style="top: 0.5rem; z-index: 1000"
        >
          <table
            class="mb-0 overflow-hidden rounded border-collapse text-sm"
            style="background: rgba(255, 255, 255, 0.9); min-width: 240px"
          >
            <thead class="bg-neutral-800 text-white">
              <tr>
                <th colspan="2" class="border border-neutral-300 px-2 py-1 text-center">設定</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="border border-neutral-300 px-2 py-1 align-middle font-semibold">管の種類</td>
                <td class="border border-neutral-300 px-2 py-1">
                  <select class="rounded border border-neutral-300 bg-white px-2 py-1 text-sm text-neutral-900" id="typeSelect">
                    <option value="closed">閉管</option>
                    <option value="open">開管</option>
                  </select>
                </td>
              </tr>
              <tr>
                <td class="border border-neutral-300 px-2 py-1 align-middle font-semibold">倍振動数</td>
                <td class="border border-neutral-300 px-2 py-1">
                  <div class="flex items-center gap-1">
                    <button class="rounded bg-blue-600 px-2 py-1 text-sm text-white hover:bg-blue-500" id="mnMinusBtn">
                      －
                    </button>
                    <strong id="mnDisplay" class="mx-1">1</strong>
                    <button class="rounded bg-amber-500 px-2 py-1 text-sm text-neutral-900 hover:bg-amber-400" id="mnPlusBtn">
                      ＋
                    </button>
                  </div>
                </td>
              </tr>
              <tr>
                <td class="border border-neutral-300 px-2 py-1 align-middle font-semibold">管の長さ</td>
                <td class="border border-neutral-300 px-2 py-1">
                  <div class="flex items-center gap-1">
                    <button class="rounded bg-blue-600 px-2 py-1 text-sm text-white hover:bg-blue-500" id="lminusBtn">
                      －
                    </button>
                    <strong id="lDisplay" class="mx-1">400</strong>
                    <button class="rounded bg-amber-500 px-2 py-1 text-sm text-neutral-900 hover:bg-amber-400" id="lplusBtn">
                      ＋
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <script type="module" src="./js/index.js"></script>
  </body>
</html>
