<!doctype html>
<html lang="ja">
  <head>
    <title>空気柱の共鳴</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" vite-ignore />
  </head>
  <body class="bg-dark" oncontextmenu="return false;">
    <nav class="navbar navbar-expand-md bg-dark border-bottom border-bottom-dark fixed-top" data-bs-theme="dark" id="navBar">
      <div class="container-fluid">
        <a class="navbar-brand" href="https://bicpema.com/">Bicpema</a>
        <span class="text-light fw-lighter">空気柱の共鳴</span>
      </div>
    </nav>
    <div class="container-fluid" id="p5Container">
      <div id="p5Canvas"></div>
      <div class="position-absolute start-0 m-3 p-3 rounded" style="top: 4.5rem; background: rgba(255,255,255,0.9); z-index: 1000; min-width: 200px;">
        <div class="mb-2">
          <label class="form-label mb-1">管の種類</label>
          <select class="form-select form-select-sm" id="typeSelect">
            <option value="closed">閉管</option>
            <option value="open">開管</option>
          </select>
        </div>
        <div class="mb-2 d-flex align-items-center gap-2">
          <span>倍振動数: <strong id="mnDisplay">1</strong></span>
          <button class="btn btn-sm btn-warning" id="mnPlusBtn">＋</button>
          <button class="btn btn-sm btn-primary" id="mnMinusBtn">ー</button>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span>管の長さ: <strong id="lDisplay">400</strong></span>
          <button class="btn btn-sm btn-warning" id="lplusBtn">＋</button>
          <button class="btn btn-sm btn-primary" id="lminusBtn">ー</button>
        </div>
      </div>
    </div>
    <script type="module" src="./js/index.js"></script>
  </body>
</html>
