<!doctype html>
<html lang="ja">
  <head>
    <title>空気柱の共鳴</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body class="bg-neutral-900" oncontextmenu="return false;">
    <bicpema-nav-bar></bicpema-nav-bar>
    <div class="w-full p-0 mt-[60px]" id="p5Container">
      <div class="relative flex justify-center" id="p5Canvas">
        <!-- 設定モーダル -->
        <bicpema-settings-modal
          id="settingsModal"
          variant="dark"
          panel-class="w-[320px] p-6 max-[576px]:w-[320px] max-[576px]:p-6"
        >
          <div class="mb-3">
            <label for="typeSelect" class="mb-1 block text-sm">管の種類</label>
            <select class="form-control px-2 py-1 text-sm" id="typeSelect">
              <option value="closed">閉管</option>
              <option value="open">開管</option>
            </select>
          </div>
          <div class="mb-3">
            <span class="mb-1 block text-sm">倍振動数</span>
            <div class="flex items-center gap-2">
              <button
                class="rounded bg-blue-600 px-2 py-1 text-sm text-white hover:bg-blue-500"
                id="mnMinusBtn"
              >
                －
              </button>
              <strong id="mnDisplay" class="mx-1">1</strong>
              <button
                class="rounded bg-amber-500 px-2 py-1 text-sm text-neutral-900 hover:bg-amber-400"
                id="mnPlusBtn"
              >
                ＋
              </button>
            </div>
          </div>
          <div class="mb-4">
            <span class="mb-1 block text-sm">管の長さ</span>
            <div class="flex items-center gap-2">
              <button
                class="rounded bg-blue-600 px-2 py-1 text-sm text-white hover:bg-blue-500"
                id="lminusBtn"
              >
                －
              </button>
              <strong id="lDisplay" class="mx-1">400</strong>
              <button
                class="rounded bg-amber-500 px-2 py-1 text-sm text-neutral-900 hover:bg-amber-400"
                id="lplusBtn"
              >
                ＋
              </button>
            </div>
          </div>
        </bicpema-settings-modal>

        <!-- 左下: 再生/一時停止・リセット -->
        <div class="absolute bottom-0 start-0 z-[1000] m-3 flex gap-2">
          <button
            id="playPauseButton"
            class="rounded bg-green-600 px-4 py-2 text-white hover:bg-green-500"
          >
            ▶ 開始
          </button>
          <button
            id="resetButton"
            class="rounded bg-neutral-600 px-4 py-2 text-white hover:bg-neutral-500"
          >
            🔄 リセット
          </button>
        </div>

        <!-- 右上: 設定ボタン -->
        <bicpema-settings-button id="toggleModal"></bicpema-settings-button>
      </div>
    </div>
    <!-- ローディングスピナー（p5.jsの初回draw()実行時にts/index.tsで非表示にします） -->
    <bicpema-loading-spinner></bicpema-loading-spinner>

    <script type="module" src="./ts/index.ts"></script>
  </body>
</html>
