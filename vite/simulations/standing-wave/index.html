<!doctype html>
<html lang="ja">
  <head>
    <title>定在波</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>
  <body class="bg-neutral-900" oncontextmenu="return false;">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">定在波</span>
    </nav>

    <div class="w-full" id="p5Container">
      <div id="p5Canvas"></div>

      <!-- 凡例 -->
      <div class="absolute top-0 end-0 m-2 mt-12 pt-4">
        <span class="me-1 rounded-full bg-red-600 px-2 py-1 text-xs text-white">右進み波</span>
        <span class="me-1 rounded-full bg-blue-600 px-2 py-1 text-xs text-white">左進み波</span>
        <span class="rounded-full px-2 py-1 text-xs text-white" style="background-color: #00b400"
          >定在波</span
        >
      </div>

      <!-- 左下ボタンエリア -->
      <div class="absolute bottom-0 start-0 m-3 flex gap-2">
        <button class="rounded bg-blue-600 px-3 py-2 text-white hover:bg-blue-500" id="moveBtn">スタート</button>
        <button class="rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500" id="resetBtn">リセット</button>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
