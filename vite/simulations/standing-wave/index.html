<!doctype html>
<html lang="ja">
  <head>
    <title>定在波</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>
  <body class="bg-dark" oncontextmenu="return false;">
    <nav
      class="navbar navbar-expand-md bg-dark border-bottom border-bottom-dark fixed-top"
      data-bs-theme="dark"
      id="navBar"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="https://bicpema.com/">Bicpema</a>
        <span class="text-light fw-lighter">定在波</span>
      </div>
    </nav>

    <div class="container-fluid" id="p5Container">
      <div id="p5Canvas"></div>

      <!-- 凡例 -->
      <div class="position-absolute top-0 end-0 m-2 mt-5 pt-3">
        <span class="badge rounded-pill text-bg-danger me-1">右進み波</span>
        <span class="badge rounded-pill text-bg-primary me-1">左進み波</span>
        <span class="badge rounded-pill" style="background-color: #00b400"
          >定在波</span
        >
      </div>

      <!-- 左下ボタンエリア -->
      <div class="position-absolute bottom-0 start-0 m-3 d-flex gap-2">
        <button class="btn btn-primary" id="moveBtn">スタート</button>
        <button class="btn btn-secondary" id="resetBtn">リセット</button>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
