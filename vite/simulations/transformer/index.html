<!doctype html>
<html lang="ja">
  <head>
    <title>変圧器</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>

  <body class="bg-neutral-900" oncontextmenu="return false;">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">変圧器</span>
    </nav>

    <div class="w-full" id="p5Container">
      <div id="p5Canvas"></div>
    </div>

    <!-- 下部設定パネル -->
    <div
      id="settingsPanel"
      class="fixed bottom-0 start-0 end-0 flex items-center gap-4 px-4 py-2"
      style="background: rgba(30, 30, 30, 0.95); z-index: 1000; flex-wrap: wrap"
    >
      <div class="flex items-center gap-2">
        <span class="text-sm font-bold text-white">位相</span>
        <div class="mb-0 flex items-center gap-1">
          <input
            class="h-4 w-4 accent-blue-600"
            type="radio"
            name="phase"
            id="phaseSame"
            value="true"
            checked
          />
          <label class="text-sm text-white" for="phaseSame"
            >同位相</label
          >
        </div>
        <div class="mb-0 flex items-center gap-1">
          <input
            class="h-4 w-4 accent-blue-600"
            type="radio"
            name="phase"
            id="phaseOpposite"
            value="false"
          />
          <label class="text-sm text-white" for="phaseOpposite"
            >逆位相</label
          >
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-sm font-bold text-white">速度</span>
        <div class="mb-0 flex items-center gap-1">
          <input
            class="h-4 w-4 accent-blue-600"
            type="radio"
            name="speed"
            id="speedSlow"
            value="1"
            checked
          />
          <label class="text-sm text-white" for="speedSlow"
            >ゆっくり</label
          >
        </div>
        <div class="mb-0 flex items-center gap-1">
          <input
            class="h-4 w-4 accent-blue-600"
            type="radio"
            name="speed"
            id="speedFast"
            value="5"
          />
          <label class="text-sm text-white" for="speedFast"
            >はやい</label
          >
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-sm font-bold text-white">一次コイル 巻数</span>
        <button class="rounded bg-amber-500 px-2 py-1 text-sm text-neutral-900 hover:bg-amber-400" id="coil1PlusBtn">＋</button>
        <button class="rounded bg-blue-600 px-2 py-1 text-sm text-white hover:bg-blue-500" id="coil1MinusBtn">ー</button>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-sm font-bold text-white">二次コイル 巻数</span>
        <button class="rounded bg-amber-500 px-2 py-1 text-sm text-neutral-900 hover:bg-amber-400" id="coil2PlusBtn">＋</button>
        <button class="rounded bg-blue-600 px-2 py-1 text-sm text-white hover:bg-blue-500" id="coil2MinusBtn">ー</button>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
