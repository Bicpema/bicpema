<!doctype html>
<html lang="ja">
  <head>
    <title>振り子の実験</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body
    class="m-0 h-screen w-screen p-0 fixed text-base"
    oncontextmenu="return false;"
  >
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a
        class="font-semibold text-white no-underline"
        href="https://bicpema.com/"
        >Bicpema</a
      >
      <span class="ml-3 font-light text-neutral-300">振り子の実験</span>
    </nav>

    <div class="mt-[60px]" id="p5Canvas"></div>

    <!-- Button trigger modal -->
    <button
      type="button"
      class="settings-modal-open absolute bottom-0 m-3 rounded-full bg-blue-600 px-4 py-2 text-white hover:bg-blue-500"
    >
      シミュレーションの設定
    </button>

    <!-- Modal -->
    <div
      class="fixed inset-0 z-[1100] hidden flex items-center justify-center bg-black/50"
      id="exampleModal"
    >
      <div class="w-full max-w-lg rounded bg-white p-4 text-neutral-900">
        <div
          class="mb-3 flex items-center justify-between border-b border-neutral-200 pb-2"
        >
          <h1 class="text-lg font-semibold">シミュレーションの設定</h1>
          <button
            type="button"
            class="modal-close text-xl leading-none text-neutral-500 hover:text-neutral-700"
            aria-label="Close"
          >
            ×
          </button>
        </div>
        <div>
          <div class="mb-4">
            <h2 class="mb-2 font-semibold">左の振り子の設定</h2>
            <div class="mb-2 flex">
              <span
                class="inline-flex items-center whitespace-nowrap rounded-l border border-r-0 border-neutral-300 bg-neutral-100 px-3 text-sm text-neutral-700"
                >振れ角度[°]</span
              >
              <input
                type="number"
                class="w-full rounded-r border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900"
                id="leftAngleInput"
                placeholder="左の振れ角"
                aria-label="Angle"
                value="10"
              />
            </div>
            <div class="flex">
              <span
                class="inline-flex items-center whitespace-nowrap rounded-l border border-r-0 border-neutral-300 bg-neutral-100 px-3 text-sm text-neutral-700"
                >紐の長さ[cm]</span
              >
              <input
                type="number"
                class="w-full rounded-r border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900"
                id="leftLengthInput"
                placeholder="左の紐の長さ"
                aria-label="Length"
                value="10"
              />
            </div>
          </div>
          <div class="mb-4">
            <h2 class="mb-2 font-semibold">右の振り子の設定</h2>
            <div class="mb-2 flex">
              <span
                class="inline-flex items-center whitespace-nowrap rounded-l border border-r-0 border-neutral-300 bg-neutral-100 px-3 text-sm text-neutral-700"
                >振れ角度[°]</span
              >
              <input
                type="number"
                class="w-full rounded-r border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900"
                id="rightAngleInput"
                placeholder="右の振れ角"
                aria-label="Angle"
                value="20"
              />
            </div>
            <div class="flex">
              <span
                class="inline-flex items-center whitespace-nowrap rounded-l border border-r-0 border-neutral-300 bg-neutral-100 px-3 text-sm text-neutral-700"
                >紐の長さ[cm]</span
              >
              <input
                type="number"
                class="w-full rounded-r border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900"
                id="rightLengthInput"
                placeholder="右の紐の長さ"
                aria-label="Length"
                value="10"
              />
            </div>
          </div>
        </div>
        <div class="flex justify-end border-t border-neutral-200 pt-2">
          <button
            type="button"
            class="modal-close rounded border border-neutral-400 px-3 py-1.5 hover:bg-neutral-100"
          >
            閉じる
          </button>
        </div>
      </div>
    </div>
    <button
      class="absolute end-0 m-3 rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500"
      id="gridButton"
    >
      グリッド線の表示
    </button>
    <div class="absolute bottom-0 end-0 m-3">
      <button
        class="mr-2 rounded bg-blue-600 px-3 py-2 text-white hover:bg-blue-500"
        id="startButton"
      >
        スタート
      </button>
      <button
        class="mr-2 rounded bg-blue-600 px-3 py-2 text-white hover:bg-blue-500"
        id="stopButton"
      >
        ストップ
      </button>
      <button
        class="rounded bg-red-600 px-3 py-2 text-white hover:bg-red-500"
        id="resetButton"
      >
        リセット
      </button>
    </div>
    <!-- ローディングスピナー（p5.jsの初回draw()実行時にjs/index.jsで非表示にします） -->
    <div
      id="loadingSpinner"
      class="fixed inset-0 z-[2000] flex items-center justify-center bg-neutral-900"
      role="status"
      aria-live="polite"
      aria-label="読み込み中"
    >
      <div
        class="h-12 w-12 animate-spin rounded-full border-4 border-neutral-600 border-t-blue-500"
      ></div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
