<!doctype html>
<html lang="ja">
  <head>
    <title>振り子の実験</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" vite-ignore />
  </head>

  <body class="bg-dark" oncontextmenu="return false;">
    <nav
      class="navbar navbar-expand-md bg-dark border-bottom border-bottom-dark fixed-top"
      data-bs-theme="dark"
      id="navBar"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="https://bicpema.com/">Bicpema</a>
        <span class="text-light fw-lighter">振り子の実験</span>
      </div>
    </nav>

    <div class="container-fluid" id="p5Container">
      <div id="p5Canvas"></div>

      <div class="right-top-controls">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
          シミュレーションの設定
        </button>
      </div>

      <div class="left-bottom-controls">
        <button class="btn btn-success" id="startButton">スタート</button>
        <button class="btn btn-secondary" id="stopButton">ストップ</button>
        <button class="btn btn-danger" id="resetButton">リセット</button>
      </div>

      <div style="position: absolute; bottom: 20px; right: 20px; z-index: 1000;">
        <button class="btn btn-secondary" id="gridButton">グリッド線の表示</button>
      </div>
    </div>

    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">シミュレーションの設定</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <h2>左の振り子の設定</h2>
              <div class="input-group mb-2">
                <span class="input-group-text">振れ角度[°]</span>
                <input type="number" class="form-control" id="leftAngleInput" placeholder="左の振れ角" aria-label="Angle" value="10">
              </div>
              <div class="input-group">
                <span class="input-group-text">紐の長さ[cm]</span>
                <input type="number" class="form-control" id="leftLengthInput" placeholder="左の紐の長さ" aria-label="Length" value="10">
              </div>
            </div>
            <div class="mb-3">
              <h2>右の振り子の設定</h2>
              <div class="input-group mb-2">
                <span class="input-group-text">振れ角度[°]</span>
                <input type="number" class="form-control" id="rightAngleInput" placeholder="右の振れ角" aria-label="Angle" value="20">
              </div>
              <div class="input-group">
                <span class="input-group-text">紐の長さ[cm]</span>
                <input type="number" class="form-control" id="rightLengthInput" placeholder="右の紐の長さ" aria-label="Length" value="10">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
