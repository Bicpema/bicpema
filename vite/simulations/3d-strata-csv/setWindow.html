<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>地層データの登録</title>
  </head>

  <body>
    <div class="container">
      <div class="m-2">
        <h1 id="placeName">地層データ編集</h1>
        <p>
          ※地層を追加する際には右の「地層を追加」ボタンを押し、削除する際にはそれぞれの行の「削除」ボタンを押してください。
        </p>
        <div class="mb-3 text-end">
          <button class="rounded border border-blue-600 bg-white px-3 py-1.5 text-blue-600 hover:bg-blue-50" id="trAddButton">
            地層の追加
          </button>
        </div>
        <table class="w-full border-collapse text-sm">
          <thead>
            <tr>
              <th class="border border-neutral-300 bg-neutral-100 px-2 py-1" style="width: 11%">番号</th>
              <th class="border border-neutral-300 bg-neutral-100 px-2 py-1" style="width: 26%">堆積物の上端の深さ</th>
              <th class="border border-neutral-300 bg-neutral-100 px-2 py-1" style="width: 26%">堆積物の下端の深さ</th>
              <th class="border border-neutral-300 bg-neutral-100 px-2 py-1" style="width: 26%">岩相の種類</th>
              <th class="border border-neutral-300 bg-neutral-100 px-2 py-1" style="width: 11%">削除ボタン</th>
            </tr>
          </thead>
          <tbody id="tablebody"></tbody>
        </table>
        <div class="text-end">
          <button
            type="button"
            class="rounded border border-neutral-400 px-3 py-1.5 hover:bg-neutral-100"
            onclick="window.close()"
          >
            閉じる
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="./js/setWindow.js"></script>
  </body>
</html>
