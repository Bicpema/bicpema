<!doctype html>
<html lang="ja">
  <head>
    <title>直線電流の磁場</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body class="bg-neutral-900" oncontextmenu="return false;">
    <bicpema-nav-bar></bicpema-nav-bar>

    <div class="relative w-full p-0 mt-[60px]" id="p5Container">
      <div class="flex justify-center" id="p5Canvas"></div>

      <!-- 左上: 観測情報パネル（常時表示） -->
      <div
        class="info-panel absolute top-2.5 left-2.5 z-[1000] w-[340px]"
        role="region"
        aria-label="情報パネル"
      >
        <div class="pb-2 text-[13px] text-gray-500">
          <div class="text-base font-bold text-gray-900">
            B = μ<sub>0</sub>I/(2πr)
          </div>
          <div>μ<sub>0</sub>: 真空の透磁率、I: 電流</div>
        </div>
        <div class="info-panel-row info-panel-row-divided">
          <span class="info-panel-label">磁場の向き</span>
          <span
            id="fieldDirectionValue"
            class="info-panel-value min-w-0 font-sans text-base"
            >反時計回り</span
          >
        </div>
        <div class="info-panel-row">
          <span class="info-panel-label">相対磁場強度 B（r=50）</span>
          <span id="bValueDisplay" class="info-panel-value">0.0000</span>
          <span class="info-panel-unit">∝|I|/r</span>
        </div>
        <div class="info-panel-note mt-1" id="directionRelationLabel">
          電流 +（正方向）→ 磁場 反時計回り（右ねじ）<br />
          ※矢印は向きの表示で、回転速度は一定です
        </div>
      </div>

      <!-- 設定モーダル -->
      <bicpema-settings-modal
        id="settingsModal"
        variant="dark"
        panel-class="w-[300px] p-6 max-[576px]:w-[300px] max-[576px]:p-6"
      >
        <div class="mb-4">
          <label class="mb-1 block text-sm" id="currentLabel"
            >電流の強さ: 1.0 A</label
          >
          <input
            type="range"
            class="accent-blue-600 w-full"
            id="currentSlider"
            min="-4"
            max="4"
            step="1"
            value="1"
          />
        </div>
      </bicpema-settings-modal>

      <!-- 左下: 再生/一時停止・リセット -->
      <div class="absolute bottom-0 start-0 z-[1000] m-3 flex gap-2">
        <button
          id="playPauseButton"
          class="rounded bg-green-600 px-4 py-2 text-white hover:bg-green-500"
        >
          ▶ 開始
        </button>
        <button
          id="resetButton"
          class="rounded bg-neutral-600 px-4 py-2 text-white hover:bg-neutral-500"
        >
          🔄 リセット
        </button>
      </div>

      <!-- 右上: 設定ボタン -->
      <bicpema-settings-button id="toggleModal"></bicpema-settings-button>
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にts/index.tsで非表示にします） -->
    <bicpema-loading-spinner></bicpema-loading-spinner>

    <script type="module" src="./ts/index.ts"></script>
  </body>
</html>
