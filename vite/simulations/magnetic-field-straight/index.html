<!doctype html>
<html lang="ja">
  <head>
    <title>直線電流の磁場</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" vite-ignore />
  </head>
  <body class="bg-dark" oncontextmenu="return false;">
    <nav
      class="navbar navbar-expand-md bg-dark border-bottom border-bottom-dark fixed-top"
      data-bs-theme="dark"
      id="navBar"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="https://bicpema.com/">Bicpema</a>
        <span class="text-light fw-lighter">直線電流の磁場</span>
      </div>
    </nav>

    <div class="container-fluid" id="p5Container">
      <div id="p5Canvas"></div>
    </div>

    <!-- Top-left settings panel -->
    <div
      class="position-absolute start-0 m-3 p-3 rounded"
      style="top: 4.5rem; background: rgba(255,255,255,0.85); z-index: 1000;"
    >
      <label class="form-label mb-1" id="currentLabel">電流の強さ: 1.0 A</label>
      <input
        type="range"
        class="form-range"
        id="currentSlider"
        min="-4"
        max="4"
        step="1"
        value="1"
        style="width: 150px;"
      />
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
