<!doctype html>
<html lang="ja">
  <head>
    <title>直線電流の磁場</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body class="bg-neutral-900" oncontextmenu="return false;">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">直線電流の磁場</span>
    </nav>

    <div class="w-full p-0 mt-[60px]" id="p5Container">
      <div class="flex justify-center" id="p5Canvas"></div>
    </div>

    <!-- Top-left settings panel -->
    <div
      class="absolute start-0 m-3 rounded p-3"
      style="top: 4.5rem; background: rgba(255, 255, 255, 0.85); z-index: 1000"
    >
      <label class="mb-1 block text-sm" id="currentLabel">電流の強さ: 1.0 A</label>
      <input
        type="range"
        class="accent-blue-600"
        id="currentSlider"
        min="-4"
        max="4"
        step="1"
        value="1"
        style="width: 150px"
      />
      <div class="mt-2 text-sm">
        <div><strong>B = μ<sub>0</sub>I/(2πr)</strong></div>
        <div>μ<sub>0</sub>: 真空の透磁率、I: 電流</div>
      </div>
      <div class="mt-2 text-sm" id="directionRelationLabel">
        電流 +（正方向）→ 磁場 反時計回り（右ねじ）<br />
        ※矢印は向きの表示で、回転速度は一定です
      </div>
      <div class="mt-1 text-sm" id="fieldDirectionLabel">
        現在の磁場の向き: 反時計回り
      </div>
      <div class="mt-1 text-sm" id="bValueDisplay"></div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
