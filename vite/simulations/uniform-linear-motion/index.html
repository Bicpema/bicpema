<!doctype html>
<html lang="ja">
  <head>
    <title>等速直線運動をする模型自動車のようす</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body class="bg-neutral-900" oncontextmenu="return false;">
    <bicpema-nav-bar></bicpema-nav-bar>
    <div class="w-full p-0 mt-[60px]" id="p5Container">
      <div class="flex justify-center" id="p5Canvas"></div>

      <div id="graph" class="rounded border bg-white">
        <canvas id="graphCanvas"></canvas>
      </div>

      <div id="graphButtonParent">
        <button
          type="button"
          class="rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500"
          id="graphButton"
        >
          グラフの切り替え
        </button>
      </div>

      <div id="motionControls" class="fixed bottom-0 left-0 z-[1100]">
        <button
          type="button"
          class="m-1 rounded bg-green-600 px-3 py-2 text-white hover:bg-green-500"
          id="playButton"
        >
          一時停止
        </button>
        <button
          type="button"
          class="m-1 rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500"
          id="resetButton"
        >
          リセット
        </button>
      </div>

      <bicpema-settings-button
        class="fixed top-[72px] right-4 z-[1100]"
      ></bicpema-settings-button>

      <bicpema-settings-modal title="シミュレーション設定">
        <div>
          <div class="mb-4 flex items-center gap-2" id="scaleCheckBoxParent">
            <input
              class="h-4 w-4 accent-blue-600"
              type="checkbox"
              id="scaleCheckBox"
              checked
            />
            <label class="text-sm" for="scaleCheckBox"
              >スケールの表示・非表示</label
            >
          </div>
          <div class="mb-3 mt-3 flex">
            <span
              class="inline-flex items-center whitespace-nowrap rounded-l border border-r-0 border-neutral-300 bg-neutral-100 px-3 text-sm text-neutral-700"
              id="yellowCarSpeedLabel"
              >黄色い車の速度</span
            >
            <input
              type="number"
              min="1"
              max="20"
              class="min-w-0 flex-1 border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900"
              placeholder="cm/s"
              aria-describedby="yellowCarSpeedLabel"
              id="yellowCarSpeedInput"
              value="3"
            />
            <span
              class="inline-flex items-center whitespace-nowrap rounded-r border border-l-0 border-neutral-300 bg-neutral-100 px-3 text-sm text-neutral-700"
              >cm/s</span
            >
          </div>
          <div class="mb-3 mt-3 flex">
            <span
              class="inline-flex items-center whitespace-nowrap rounded-l border border-r-0 border-neutral-300 bg-neutral-100 px-3 text-sm text-neutral-700"
              id="redCarSpeedLabel"
              >赤い車の速度</span
            >
            <input
              type="number"
              min="1"
              max="20"
              class="min-w-0 flex-1 border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900"
              placeholder="cm/s"
              aria-describedby="redCarSpeedLabel"
              id="redCarSpeedInput"
              value="2"
            />
            <span
              class="inline-flex items-center whitespace-nowrap rounded-r border border-l-0 border-neutral-300 bg-neutral-100 px-3 text-sm text-neutral-700"
              >cm/s</span
            >
          </div>
        </div>
      </bicpema-settings-modal>
    </div>
    <!-- ローディングスピナー（p5.jsの初回draw()実行時にts/index.tsで非表示にします） -->
    <bicpema-loading-spinner></bicpema-loading-spinner>

    <script type="module" src="./ts/index.ts"></script>
  </body>
</html>
