<!doctype html>
<html lang="ja">
  <head>
    <title>電車の加速と減速</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body
    class="h-full overflow-hidden bg-neutral-900 p-0"
    oncontextmenu="return false;"
  >
    <bicpema-nav-bar></bicpema-nav-bar>

    <div
      class="relative mt-[60px] flex h-[calc(100vh-60px)] w-full flex-col overflow-hidden p-0"
      id="p5Container"
    >
      <!-- 上半分: 電車のシミュレーション（p5.js） -->
      <div
        class="flex flex-[0_0_50%] justify-center overflow-hidden"
        id="p5Canvas"
      ></div>

      <!-- 下半分: v-t図（Chart.js）と操作ボタン -->
      <div class="flex min-h-0 flex-[0_0_50%] flex-col">
        <div
          class="mx-auto mt-3 min-h-0 w-[94%] flex-1 rounded-lg border bg-white p-2.5 shadow-[0_4px_12px_rgba(0,0,0,0.3)]"
          id="graph"
        >
          <canvas id="graphCanvas" class="h-full w-full"></canvas>
        </div>

        <!-- 左下コントロール -->
        <div
          class="flex flex-none gap-2.5 px-5 py-3 max-[576px]:gap-2 max-[576px]:px-2.5 max-[576px]:py-2"
        >
          <button
            type="button"
            id="resetButton"
            class="rounded-lg px-5 py-2.5 text-base font-bold whitespace-nowrap text-white shadow-[0_4px_6px_rgba(0,0,0,0.3)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 active:translate-y-0 max-[576px]:px-[15px] max-[576px]:py-2 max-[576px]:text-sm max-[400px]:px-3 max-[400px]:py-1.5 max-[400px]:text-xs bg-blue-600 hover:bg-blue-500"
          >
            🔄 リセット
          </button>
          <button
            type="button"
            id="playPauseButton"
            class="rounded-lg px-5 py-2.5 text-base font-bold whitespace-nowrap text-white shadow-[0_4px_6px_rgba(0,0,0,0.3)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 active:translate-y-0 max-[576px]:px-[15px] max-[576px]:py-2 max-[576px]:text-sm max-[400px]:px-3 max-[400px]:py-1.5 max-[400px]:text-xs bg-green-600 hover:bg-green-500"
          >
            ▶ 開始
          </button>
        </div>
      </div>

      <!-- 設定モーダルパネル -->
      <bicpema-settings-modal id="settingsModal" variant="dark">
        <div class="mb-3">
          <label for="accelerationInput" class="form-label"
            >加速度 a (m/s²): <span id="accelerationValue">2.0</span></label
          >
          <input
            type="range"
            class="form-control"
            id="accelerationInput"
            min="-5"
            max="5"
            value="2"
            step="0.5"
          />
        </div>
      </bicpema-settings-modal>

      <!-- 右上コントロール -->
      <bicpema-settings-button id="toggleModal"></bicpema-settings-button>
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にts/index.tsで非表示にします） -->
    <bicpema-loading-spinner></bicpema-loading-spinner>

    <script type="module" src="./ts/index.ts"></script>
  </body>
</html>
