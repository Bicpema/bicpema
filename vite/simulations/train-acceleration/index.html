<!doctype html>
<html lang="ja">
  <head>
    <title>電車の加速と減速</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body class="h-full overflow-hidden bg-neutral-900 p-0">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">電車の加速と減速</span>
    </nav>

    <div
      class="relative mt-[60px] flex h-[calc(100vh-60px)] w-full flex-col overflow-hidden p-0"
      id="p5Container"
    >
      <!-- p5.js canvas (upper half) -->
      <div class="flex flex-[0_0_50%] items-start justify-center overflow-hidden" id="p5Canvas"></div>

      <!-- Chart.js graph (lower half) -->
      <div class="flex-[0_0_50%] overflow-hidden bg-white pt-1.5 pr-4 pb-2.5 pl-4" id="graphContainer">
        <canvas id="graphCanvas" class="h-full w-full"></canvas>
      </div>

      <!-- 設定モーダル -->
      <div
        id="settingsModal"
        class="absolute top-1/2 left-1/2 z-[2000] w-[340px] max-w-[90vw] -translate-x-1/2 -translate-y-1/2 rounded-xl border-2 border-white/30 bg-black/90 p-[30px] text-white shadow-[0_8px_32px_rgba(0,0,0,0.5)] backdrop-blur-[15px] max-[576px]:w-[290px] max-[576px]:p-5"
        style="display: none"
      >
        <div>
          <h5 class="mb-5 text-center text-white">設定</h5>
          <div class="mb-3">
            <label for="accelerationInput" class="mb-2 block"
              >加速度 a (m/s²)</label
            >
            <input
              type="number"
              class="block w-full rounded border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900"
              id="accelerationInput"
              min="-10"
              max="10"
              value="2"
              step="0.5"
            />
          </div>
          <button id="resetButton" class="mb-2 w-full rounded bg-amber-500 px-3 py-2 text-neutral-900 hover:bg-amber-400">
            リセット
          </button>
          <button id="closeModal" class="w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500">
            閉じる
          </button>
        </div>
      </div>

      <!-- 左下コントロール -->
      <div class="absolute bottom-5 left-5 z-[1000] flex gap-2.5 max-[576px]:bottom-2.5 max-[576px]:left-2.5">
        <button
          id="playPauseButton"
          class="rounded-lg bg-blue-600 px-5 py-2.5 text-base font-bold whitespace-nowrap text-white shadow-[0_4px_6px_rgba(0,0,0,0.3)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 hover:bg-blue-500 hover:shadow-[0_6px_8px_rgba(0,0,0,0.4)] active:translate-y-0 active:shadow-[0_2px_4px_rgba(0,0,0,0.3)] max-[576px]:px-[15px] max-[576px]:py-2 max-[576px]:text-sm"
        >
          ▶ 開始
        </button>
      </div>

      <!-- 右上コントロール -->
      <div class="absolute top-2 right-5 z-[1000] max-[576px]:top-[5px] max-[576px]:right-2.5">
        <button
          id="toggleModal"
          class="rounded-lg bg-cyan-600 px-5 py-2.5 text-base font-bold whitespace-nowrap text-white shadow-[0_4px_6px_rgba(0,0,0,0.3)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 hover:bg-cyan-500 hover:shadow-[0_6px_8px_rgba(0,0,0,0.4)] active:translate-y-0 active:shadow-[0_2px_4px_rgba(0,0,0,0.3)] max-[576px]:px-[15px] max-[576px]:py-2 max-[576px]:text-sm"
        >
          設定
        </button>
      </div>
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にjs/index.jsで非表示にします） -->
    <div
      id="loadingSpinner"
      class="fixed inset-0 z-[2000] flex items-center justify-center bg-neutral-900"
      role="status"
      aria-live="polite"
      aria-label="読み込み中"
    >
      <div class="h-12 w-12 animate-spin rounded-full border-4 border-neutral-600 border-t-blue-500"></div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
