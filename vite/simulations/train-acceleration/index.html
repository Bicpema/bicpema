<!doctype html>
<html lang="ja">
  <head>
    <title>電車の加速と減速</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>

  <body class="bg-dark">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">電車の加速と減速</span>
    </nav>

    <div class="w-full" id="p5Container">
      <!-- p5.js canvas (upper half) -->
      <div id="p5Canvas"></div>

      <!-- Chart.js graph (lower half) -->
      <div id="graphContainer">
        <canvas id="graphCanvas"></canvas>
      </div>

      <!-- 設定モーダル -->
      <div id="settingsModal" class="settings-modal" style="display: none">
        <div class="modal-content-inner">
          <h5>設定</h5>
          <div class="mb-3">
            <label for="accelerationInput" class="mb-2 block"
              >加速度 a (m/s²)</label
            >
            <input
              type="number"
              class="block w-full rounded border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900"
              id="accelerationInput"
              min="-10"
              max="10"
              value="2"
              step="0.5"
            />
          </div>
          <button id="resetButton" class="mb-2 w-full rounded bg-amber-500 px-3 py-2 text-neutral-900 hover:bg-amber-400">
            リセット
          </button>
          <button id="closeModal" class="w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500">
            閉じる
          </button>
        </div>
      </div>

      <!-- 左下コントロール -->
      <div class="left-bottom-controls">
        <button id="playPauseButton" class="bg-blue-600 text-white hover:bg-blue-500">▶ 開始</button>
      </div>

      <!-- 右上コントロール -->
      <div class="right-top-controls">
        <button id="toggleModal" class="bg-cyan-600 text-white hover:bg-cyan-500">設定</button>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
