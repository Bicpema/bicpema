<!doctype html>
<html lang="ja">
  <head>
    <title>波の反射</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body class="bg-neutral-900" oncontextmenu="return false;">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">波の反射</span>
    </nav>

    <div class="w-full p-0 mt-[60px]" id="p5Container">
      <div class="flex justify-center" id="p5Canvas"></div>

      <!-- 凡例 -->
      <div class="absolute top-0 end-0 m-2 mt-12 pt-4">
        <span
          class="me-1 rounded-full px-2 py-1 text-xs text-white"
          style="background-color: #0000ff !important"
          >入射波</span
        >
        <span class="me-1 rounded-full bg-red-600 px-2 py-1 text-xs text-white">反射波</span>
        <span class="rounded-full px-2 py-1 text-xs text-white" style="background-color: #00a000"
          >合成波</span
        >
      </div>

      <!-- 左下ボタンエリア -->
      <div class="absolute bottom-0 start-0 m-3 flex gap-2">
        <button class="rounded bg-blue-600 px-3 py-2 text-white hover:bg-blue-500" id="moveBtn">スタート</button>
        <button class="rounded bg-amber-500 px-3 py-2 text-neutral-900 hover:bg-amber-400" id="modeBtn">自由端</button>
        <button class="rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500" id="resetBtn">リセット</button>
      </div>
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にjs/index.jsで非表示にします） -->
    <div
      id="loadingSpinner"
      class="fixed inset-0 z-[2000] flex items-center justify-center bg-neutral-900"
      role="status"
      aria-live="polite"
      aria-label="読み込み中"
    >
      <div class="h-12 w-12 animate-spin rounded-full border-4 border-neutral-600 border-t-blue-500"></div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
