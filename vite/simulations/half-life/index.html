<!doctype html>
<html lang="ja">
  <head>
    <title>半減期</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body class="bg-neutral-900">
    <bicpema-nav-bar></bicpema-nav-bar>

    <div class="w-full p-0 mt-[60px]" id="p5Container">
      <div class="flex justify-center" id="p5Canvas"></div>
    </div>

    <!-- 左下: スタート/ストップ + リセット ボタン -->
    <div id="toggleBtnWrapper" class="flex gap-2">
      <button
        type="button"
        class="rounded bg-blue-600 px-3 py-2 text-white hover:bg-blue-500"
        id="toggleBtn"
      >
        スタート
      </button>
      <button
        type="button"
        class="rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500"
        id="resetBtn"
      >
        リセット
      </button>
    </div>

    <!-- 右上: 設定ボタン -->
    <div id="settingsBtnWrapper">
      <bicpema-settings-button
        id="settingsButton"
        class=""
      ></bicpema-settings-button>
    </div>

    <!-- 設定モーダル -->
    <bicpema-settings-modal>
      <div class="mb-2 font-bold">物質の選択</div>
      <div class="mb-2 flex items-center gap-2">
        <input
          class="h-4 w-4 accent-blue-600"
          type="radio"
          name="material"
          id="mat5730"
          value="5730"
          checked
        />
        <label class="text-sm" for="mat5730">炭素 C-14</label>
      </div>
      <div class="mb-2 flex items-center gap-2">
        <input
          class="h-4 w-4 accent-blue-600"
          type="radio"
          name="material"
          id="mat8"
          value="8"
        />
        <label class="text-sm" for="mat8">ヨウ素 I-131</label>
      </div>
      <div class="mb-4 flex items-center gap-2">
        <input
          class="h-4 w-4 accent-blue-600"
          type="radio"
          name="material"
          id="mat30"
          value="30"
        />
        <label class="text-sm" for="mat30">セシウム Cs-137</label>
      </div>
      <div class="flex items-center gap-2">
        <span>原子数:</span>
        <button
          class="rounded bg-amber-500 px-2 py-1 text-sm text-neutral-900 hover:bg-amber-400"
          id="atomPlusBtn"
        >
          ＋
        </button>
        <button
          class="rounded bg-cyan-600 px-2 py-1 text-sm text-white hover:bg-cyan-500"
          id="atomMinusBtn"
        >
          ー
        </button>
      </div>
    </bicpema-settings-modal>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にts/index.tsで非表示にします） -->
    <bicpema-loading-spinner></bicpema-loading-spinner>

    <script type="module" src="./ts/index.ts"></script>
  </body>
</html>
