<!doctype html>
<html lang="ja">
  <head>
    <title>力の合成</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body
    class="h-full overflow-hidden bg-neutral-900 p-0"
    oncontextmenu="return false;"
  >
    <bicpema-nav-bar></bicpema-nav-bar>

    <div
      class="relative mt-[60px] h-[calc(100vh-60px)] w-full overflow-hidden p-0"
      id="p5Container"
    >
      <div class="flex h-full w-full justify-center" id="p5Canvas"></div>
      <bicpema-settings-button
        id="forceSettingsButton"
        class="absolute top-4 right-4 z-[1000] max-[576px]:top-2.5 max-[576px]:right-2.5"
      ></bicpema-settings-button>
    </div>

    <bicpema-settings-modal id="forceSettingsModal" title="設定">
      <div class="text-sm">
        矢印の先端をドラッグして、2つの力の大きさと向きを設定できます。
      </div>
    </bicpema-settings-modal>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にts/index.tsで非表示にします） -->
    <bicpema-loading-spinner></bicpema-loading-spinner>

    <script type="module" src="./ts/index.ts"></script>
  </body>
</html>
