<!doctype html>
<html lang="ja">
  <head>
    <title>力の合成</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>

  <body class="bg-dark" oncontextmenu="return false;">
    <nav
      class="navbar navbar-expand-md bg-dark border-bottom border-bottom-dark fixed-top"
      data-bs-theme="dark"
      id="navBar"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="https://bicpema.com/">Bicpema</a>
        <span class="text-light fw-lighter">力の合成</span>
      </div>
    </nav>

    <div class="container-fluid" id="p5Container">
      <div id="p5Canvas"></div>
      <button
        id="forceSettingsButton"
        class="btn btn-primary right-top-controls"
        data-bs-target="#forceSettingsModal"
        data-bs-toggle="modal"
        type="button"
      >設定</button>
    </div>

    <div class="modal fade" id="forceSettingsModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h1 class="modal-title fs-5">設定</h1></div>
        <div class="modal-body">矢印の先端をドラッグして、2つの力の大きさと向きを設定できます。</div>
      </div></div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
