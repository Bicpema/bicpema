<!doctype html>
<html lang="ja">
  <head>
    <title>力の合成</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>

  <body class="bg-neutral-900" oncontextmenu="return false;">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">力の合成</span>
    </nav>

    <div class="w-full" id="p5Container">
      <div id="p5Canvas"></div>
      <button
        id="forceSettingsButton"
        class="right-top-controls bg-blue-600 text-white hover:bg-blue-500"
        type="button"
      >設定</button>
    </div>

    <div class="fixed inset-0 z-[1100] hidden flex items-center justify-center bg-black/50" id="forceSettingsModal">
      <div class="w-full max-w-lg rounded bg-white p-4 text-neutral-900">
        <div class="mb-3 border-b border-neutral-200 pb-2"><h1 class="text-lg font-semibold">設定</h1></div>
        <div class="text-sm">矢印の先端をドラッグして、2つの力の大きさと向きを設定できます。</div>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
