<!doctype html>
<html lang="ja">
  <head>
    <title>力の合成</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body class="h-full overflow-hidden bg-neutral-900 p-0" oncontextmenu="return false;">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">力の合成</span>
    </nav>

    <div class="relative mt-[60px] h-[calc(100vh-60px)] w-full overflow-hidden p-0" id="p5Container">
      <div class="flex h-full w-full justify-center" id="p5Canvas"></div>
      <button
        id="forceSettingsButton"
        class="absolute top-4 right-4 z-[1000] rounded-lg bg-blue-600 px-5 py-2 text-base font-bold text-white shadow-md transition hover:-translate-y-0.5 hover:bg-blue-500 hover:shadow-lg active:translate-y-0 active:shadow max-[576px]:top-2.5 max-[576px]:right-2.5"
        type="button"
      >設定</button>
    </div>

    <div class="fixed inset-0 z-[1100] hidden flex items-center justify-center bg-black/50" id="forceSettingsModal">
      <div class="w-full max-w-lg rounded bg-white p-4 text-neutral-900">
        <div class="mb-3 flex items-center justify-between border-b border-neutral-200 pb-2">
          <h1 class="text-lg font-semibold">設定</h1>
          <button
            type="button"
            class="modal-close text-xl leading-none text-neutral-500 hover:text-neutral-700"
            aria-label="閉じる"
          >
            ×
          </button>
        </div>
        <div class="text-sm">矢印の先端をドラッグして、2つの力の大きさと向きを設定できます。</div>
        <div class="mt-4 flex justify-end border-t border-neutral-200 pt-2">
          <button
            type="button"
            class="modal-close rounded border border-neutral-400 px-3 py-1.5 hover:bg-neutral-100"
          >
            閉じる
          </button>
        </div>
      </div>
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にjs/index.jsで非表示にします） -->
    <div
      id="loadingSpinner"
      class="fixed inset-0 z-[2000] flex items-center justify-center bg-neutral-900"
      role="status"
      aria-live="polite"
      aria-label="読み込み中"
    >
      <div class="h-12 w-12 animate-spin rounded-full border-4 border-neutral-600 border-t-blue-500"></div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
