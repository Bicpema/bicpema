<!doctype html>
<html lang="ja">
  <head>
    <title>セロハンによる偏光の変化</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body
    class="h-full overflow-hidden bg-neutral-900 p-0"
    oncontextmenu="return false;"
  >
    <bicpema-nav-bar></bicpema-nav-bar>

    <div
      class="relative mt-[60px] flex h-[calc(100vh-60px)] w-full overflow-hidden p-0"
      id="p5Container"
    >
      <div
        class="flex h-full flex-[0_0_66.6667%] items-center justify-center overflow-hidden"
        id="p5Canvas"
      ></div>

      <div
        class="flex h-full flex-[0_0_33.3333%] flex-col gap-2 overflow-hidden bg-neutral-900 p-2"
      >
        <div class="flex gap-2">
          <div
            class="flex-1 rounded border border-neutral-700 bg-white p-2 text-center font-bold text-neutral-900"
            id="incidentColor"
          >
            入射光
          </div>
          <div
            class="flex-1 rounded border border-neutral-700 bg-white p-2 text-center font-bold text-neutral-900"
            id="transmittedColor"
          >
            出射光
          </div>
          <bicpema-settings-button class="shrink-0"></bicpema-settings-button>
        </div>
        <div class="relative min-h-0 flex-1 rounded bg-white p-1">
          <canvas id="graphChart"></canvas>
        </div>
        <div class="relative min-h-0 flex-1 rounded bg-white p-1">
          <canvas id="cmfGraphChart"></canvas>
        </div>
      </div>

      <!-- 左下の再生操作エリア -->
      <div class="absolute bottom-0 left-0 z-[1000] m-3">
        <button
          type="button"
          id="playPauseButton"
          class="cursor-pointer rounded bg-red-600 px-3 py-2 text-white hover:bg-red-500"
        >
          ストップ
        </button>
      </div>
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にts/index.tsで非表示にします） -->
    <bicpema-loading-spinner></bicpema-loading-spinner>

    <!-- 設定モーダル -->
    <bicpema-settings-modal>
      <div class="mb-4">
        <button
          type="button"
          id="waveRepresentationButton"
          class="rounded bg-blue-600 px-3 py-2 text-white hover:bg-blue-500"
        >
          波動表現の切り替え
        </button>
        <p class="mt-1 text-sm text-neutral-600">
          光の波の表現方法（球・直線）を切り替えます。
        </p>
      </div>

      <div class="mb-4">
        <label
          class="mb-1 block text-sm font-semibold"
          for="cellophaneCountSlider"
        >
          セロハンテープの枚数: <span id="cellophaneCountValue">1</span>枚
        </label>
        <input
          type="range"
          class="w-full"
          id="cellophaneCountSlider"
          min="1"
          max="10"
          step="1"
          value="1"
        />
      </div>

      <div class="mb-2">
        <span class="mb-1 block text-sm font-semibold">表示する光線の色</span>
        <div class="flex gap-2">
          <button
            type="button"
            id="rButton"
            class="flex-1 rounded bg-red-600 px-3 py-2 text-white hover:bg-red-500"
          >
            赤(600 nm)
          </button>
          <button
            type="button"
            id="gButton"
            class="flex-1 rounded bg-green-600 px-3 py-2 text-white hover:bg-green-500"
          >
            緑(550 nm)
          </button>
          <button
            type="button"
            id="bButton"
            class="flex-1 rounded bg-blue-600 px-3 py-2 text-white hover:bg-blue-500"
          >
            青(450 nm)
          </button>
        </div>
      </div>
    </bicpema-settings-modal>

    <script type="module" src="./ts/index.ts"></script>
  </body>
</html>
