<!doctype html>
<html lang="ja">
  <head>
    <title>温度変化に要する熱量</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" vite-ignore />
  </head>
  <body class="bg-dark" oncontextmenu="return false;">
    <nav
      class="navbar navbar-expand-md bg-dark border-bottom border-bottom-dark fixed-top"
      data-bs-theme="dark"
      id="navBar"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="https://bicpema.com/">Bicpema</a>
        <span class="text-light fw-lighter">温度変化に要する熱量</span>
      </div>
    </nav>

    <div class="container-fluid" id="p5Container">
      <div id="p5Canvas" style="position: relative;">

      <!-- 設定パネル -->
      <div
        class="position-absolute bottom-0 start-0 end-0 m-2 p-2 rounded d-flex flex-row gap-4"
        style="background: rgba(135, 206, 235, 0.9); z-index: 1000"
      >
        <div>
          <div class="fw-bold mb-1">操作</div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="contact"
              id="contactYes"
              value="0"
            />
            <label class="form-check-label" for="contactYes"
              >接触させる<br /><small>(※ただし鉄球の比熱が未知)</small></label
            >
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="contact"
              id="contactNo"
              value="1"
              checked
            />
            <label class="form-check-label" for="contactNo">接触前に戻す</label>
          </div>
        </div>
        <div>
          <div class="fw-bold mb-1">物質A</div>
          <div class="d-flex flex-row gap-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="materialA"
                id="matAl"
                value="0"
                checked
              />
              <label class="form-check-label" for="matAl">アルミニウム</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="materialA"
                id="matFe"
                value="1"
              />
              <label class="form-check-label" for="matFe">鉄</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="materialA"
                id="matCu"
                value="2"
              />
              <label class="form-check-label" for="matCu">銅</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="materialA"
                id="matAg"
                value="3"
              />
              <label class="form-check-label" for="matAg">銀</label>
            </div>
          </div>
        </div>
        <div>
          <div class="fw-bold mb-1">物質Aの質量</div>
          <div class="d-flex flex-row gap-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="massA"
                id="massLight"
                value="1"
                checked
              />
              <label class="form-check-label" for="massLight">質量(50 g)</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="massA"
                id="massHeavy"
                value="0"
              />
              <label class="form-check-label" for="massHeavy"
                >質量(100 g)</label
              >
            </div>
          </div>
        </div>
      </div>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
