<!doctype html>
<html lang="ja">
  <head>
    <title>温度変化に要する熱量</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body class="bg-neutral-900" oncontextmenu="return false;">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">温度変化に要する熱量</span>
    </nav>

    <div class="w-full p-0 mt-[60px]" id="p5Container">
      <div class="relative flex justify-center" id="p5Canvas">
        <!-- 設定パネル -->
        <div
          class="absolute bottom-0 start-0 end-0 m-2 flex flex-row gap-4 rounded p-2"
          style="background: rgba(135, 206, 235, 0.9); z-index: 1000"
        >
          <div>
            <div class="mb-1 font-bold">操作</div>
            <div class="mb-1 flex items-center gap-2">
              <input
                class="h-4 w-4 accent-blue-600"
                type="radio"
                name="contact"
                id="contactYes"
                value="0"
              />
              <label class="text-sm" for="contactYes"
                >接触させる<br /><small>(※ただし鉄球の比熱が未知)</small></label
              >
            </div>
            <div class="mb-1 flex items-center gap-2">
              <input
                class="h-4 w-4 accent-blue-600"
                type="radio"
                name="contact"
                id="contactNo"
                value="1"
                checked
              />
              <label class="text-sm" for="contactNo"
                >接触前に戻す</label
              >
            </div>
          </div>
          <div>
            <div class="mb-1 font-bold">物質A</div>
            <div class="flex flex-row gap-3">
              <div class="flex items-center gap-2">
                <input
                  class="h-4 w-4 accent-blue-600"
                  type="radio"
                  name="materialA"
                  id="matAl"
                  value="0"
                  checked
                />
                <label class="text-sm" for="matAl">アルミニウム</label>
              </div>
              <div class="flex items-center gap-2">
                <input
                  class="h-4 w-4 accent-blue-600"
                  type="radio"
                  name="materialA"
                  id="matFe"
                  value="1"
                />
                <label class="text-sm" for="matFe">鉄</label>
              </div>
              <div class="flex items-center gap-2">
                <input
                  class="h-4 w-4 accent-blue-600"
                  type="radio"
                  name="materialA"
                  id="matCu"
                  value="2"
                />
                <label class="text-sm" for="matCu">銅</label>
              </div>
              <div class="flex items-center gap-2">
                <input
                  class="h-4 w-4 accent-blue-600"
                  type="radio"
                  name="materialA"
                  id="matAg"
                  value="3"
                />
                <label class="text-sm" for="matAg">銀</label>
              </div>
            </div>
          </div>
          <div>
            <div class="mb-1 font-bold">物質Aの質量</div>
            <div class="flex flex-row gap-3">
              <div class="flex items-center gap-2">
                <input
                  class="h-4 w-4 accent-blue-600"
                  type="radio"
                  name="massA"
                  id="massLight"
                  value="1"
                  checked
                />
                <label class="text-sm" for="massLight"
                  >質量(50 g)</label
                >
              </div>
              <div class="flex items-center gap-2">
                <input
                  class="h-4 w-4 accent-blue-600"
                  type="radio"
                  name="massA"
                  id="massHeavy"
                  value="0"
                />
                <label class="text-sm" for="massHeavy"
                  >質量(100 g)</label
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にjs/index.jsで非表示にします） -->
    <div
      id="loadingSpinner"
      class="fixed inset-0 z-[2000] flex items-center justify-center bg-neutral-900"
      role="status"
      aria-live="polite"
      aria-label="読み込み中"
    >
      <div class="h-12 w-12 animate-spin rounded-full border-4 border-neutral-600 border-t-blue-500"></div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
