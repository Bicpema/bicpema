<!doctype html>
<html lang="ja">
  <head>
    <title>ばねの単振動</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" vite-ignore />
  </head>

  <body class="bg-dark" oncontextmenu="return false;">
    <nav
      class="navbar navbar-expand-md bg-dark border-bottom border-bottom-dark fixed-top"
      data-bs-theme="dark"
      id="navBar"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="https://bicpema.com/">Bicpema</a>
        <span class="text-light fw-lighter">ばねの単振動</span>
      </div>
    </nav>

    <div class="container-fluid" id="p5Container">
      <div id="p5Canvas"></div>

      <div class="left-bottom-controls">
        <button class="btn btn-success" id="startButton">スタート</button>
        <button class="btn btn-danger" id="stopButton">ストップ</button>
        <button class="btn btn-secondary" id="resetButton">リセット</button>
      </div>

      <div class="right-top-controls">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#settingModal">
          シミュレーションの設定
        </button>
      </div>
    </div>

    <div class="modal fade" id="settingModal" tabindex="-1" aria-labelledby="settingModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-3" id="settingModalLabel">シミュレーションの設定</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label fs-4">上のばねの設定</label>
              <div class="input-group">
                <span class="input-group-text">ばね定数</span>
                <input type="number" class="form-control" id="konstantButton1" value="1">
              </div>
              <div class="input-group">
                <span class="input-group-text">組み合わせ</span>
                <input type="number" class="form-control" id="combiButton1" value="1">
              </div>
              <div class="input-group">
                <span class="input-group-text">質量</span>
                <input type="number" class="form-control" id="weightButton1" value="1">
                <span class="input-group-text">kg</span>
              </div>
              <div class="input-group">
                <span class="input-group-text">振幅</span>
                <input type="number" class="form-control" id="amplitudeButton1" value="100">
                <span class="input-group-text">m</span>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fs-4">下のばねの設定</label>
              <div class="input-group">
                <span class="input-group-text">ばね定数</span>
                <input type="number" class="form-control" id="konstantButton2" value="1">
              </div>
              <div class="input-group">
                <span class="input-group-text">組み合わせ</span>
                <input type="number" class="form-control" id="combiButton2" value="1">
              </div>
              <div class="input-group">
                <span class="input-group-text">質量</span>
                <input type="number" class="form-control" id="weightButton2" value="1">
                <span class="input-group-text">kg</span>
              </div>
              <div class="input-group">
                <span class="input-group-text">振幅</span>
                <input type="number" class="form-control" id="amplitudeButton2" value="100">
                <span class="input-group-text">m</span>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
