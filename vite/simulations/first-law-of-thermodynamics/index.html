<!doctype html>
<html lang="ja">
  <head>
    <title>熱力学第一法則</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>
  <body class="bg-neutral-900">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">熱力学第一法則</span>
    </nav>

    <div class="w-full" id="p5Container">
      <div id="p5Canvas"></div>

      <!-- モーダルパネル -->
      <div id="settingsModal" class="settings-modal" style="display: none">
        <div class="modal-content">
          <h5>設定</h5>
          <div class="mb-4">
            <label class="mb-2 block">加えた熱量 Q</label>
            <div class="flex flex-col gap-2">
              <div class="flex items-center gap-2">
                <input
                  class="h-4 w-4 accent-blue-600"
                  type="radio"
                  name="qValue"
                  id="q0"
                  value="0"
                  checked
                />
                <label class="text-sm" for="q0">0 [J]</label>
              </div>
              <div class="flex items-center gap-2">
                <input
                  class="h-4 w-4 accent-blue-600"
                  type="radio"
                  name="qValue"
                  id="q1"
                  value="1"
                />
                <label class="text-sm" for="q1">Q [J]</label>
              </div>
              <div class="flex items-center gap-2">
                <input
                  class="h-4 w-4 accent-blue-600"
                  type="radio"
                  name="qValue"
                  id="q2"
                  value="2"
                />
                <label class="text-sm" for="q2">2Q [J]</label>
              </div>
              <div class="flex items-center gap-2">
                <input
                  class="h-4 w-4 accent-blue-600"
                  type="radio"
                  name="qValue"
                  id="q3"
                  value="3"
                />
                <label class="text-sm" for="q3">3Q [J]</label>
              </div>
              <div class="flex items-center gap-2">
                <input
                  class="h-4 w-4 accent-blue-600"
                  type="radio"
                  name="qValue"
                  id="q4"
                  value="4"
                />
                <label class="text-sm" for="q4">4Q [J]</label>
              </div>
              <div class="flex items-center gap-2">
                <input
                  class="h-4 w-4 accent-blue-600"
                  type="radio"
                  name="qValue"
                  id="q5"
                  value="5"
                />
                <label class="text-sm" for="q5">5Q [J]</label>
              </div>
            </div>
          </div>
          <button id="closeModal" class="w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500">
            閉じる
          </button>
        </div>
      </div>

      <!-- 左下コントロール -->
      <div class="left-bottom-controls">
        <button id="resetButton" class="bg-neutral-600 text-white hover:bg-neutral-500">リセット</button>
      </div>

      <!-- 右上コントロール -->
      <div class="right-top-controls">
        <button id="toggleModal" class="bg-cyan-600 text-white hover:bg-cyan-500">設定</button>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
