<!doctype html>
<html lang="ja">
  <head>
    <title>熱機関</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>
  <body class="bg-neutral-900" oncontextmenu="return false;">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">熱機関</span>
    </nav>
    <div class="w-full" id="p5Container">
      <div id="p5Canvas"></div>
      <div id="simulationControls" class="m-3">
        <button class="m-1 rounded bg-green-600 px-3 py-2 text-white hover:bg-green-500" id="playButton" type="button">一時停止</button>
        <button class="m-1 rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500" id="resetButton" type="button">リセット</button>
      </div>
    </div>
    <script type="module" src="./js/index.js"></script>
  </body>
</html>
