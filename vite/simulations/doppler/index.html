<!doctype html>
<html lang="ja">
  <head>
    <title>ドップラー効果</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>

  <body class="bg-neutral-900">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">ドップラー効果</span>
    </nav>

    <div class="w-full" id="p5Container">
      <div id="p5Canvas"></div>

      <!-- モーダルパネル -->
      <div id="settingsModal" class="settings-modal" style="display: none">
        <div class="modal-content">
          <h5>設定</h5>
          <div class="mb-4">
            <label for="speedInput" class="mb-2 block">音源の速度 (m/s)</label>
            <input
              type="number"
              class="block w-full rounded border border-neutral-300 bg-white px-3 py-1.5 text-neutral-900"
              id="speedInput"
              min="0"
              max="1000"
              value="340"
              step="1"
            />
          </div>
          <button id="closeModal" class="w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500">
            閉じる
          </button>
        </div>
      </div>

      <!-- 左下コントロール -->
      <div class="left-bottom-controls">
        <button id="startButton" class="bg-blue-600 text-white hover:bg-blue-500">スタート</button>
        <button id="stopButton" class="bg-red-600 text-white hover:bg-red-500">ストップ</button>
        <button id="resetButton" class="bg-neutral-600 text-white hover:bg-neutral-500">リセット</button>
      </div>

      <!-- 右上コントロール -->
      <div class="right-top-controls">
        <button id="settingsButton" class="bg-cyan-600 text-white hover:bg-cyan-500">設定</button>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
