<!doctype html>
<html lang="ja">
  <head>
    <title>縦横波</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" vite-ignore />
  </head>
  <body class="bg-dark" oncontextmenu="return false;">
    <nav
      class="navbar navbar-expand-md bg-dark border-bottom border-bottom-dark fixed-top"
      data-bs-theme="dark"
      id="navBar"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="https://bicpema.com/">Bicpema</a>
        <span class="text-light fw-lighter">縦横波</span>
      </div>
    </nav>

    <div class="container-fluid" id="p5Container">
      <div id="p5Canvas"></div>
    </div>

    <!-- Bottom-left controls -->
    <div
      class="position-fixed bottom-0 start-0 m-3 d-flex align-items-center gap-2"
      style="z-index: 1000;"
    >
      <button class="btn btn-primary" id="moveBtn">スタート</button>
      <button class="btn btn-secondary" id="resetBtn">リセット</button>
      <div
        class="d-flex align-items-center gap-2 rounded px-3 py-2"
        style="background: rgba(255,255,255,0.15);"
      >
        <label class="text-light small mb-0" for="speedSlider">速度</label>
        <input
          type="range"
          class="form-range"
          id="speedSlider"
          min="10"
          max="60"
          step="1"
          value="30"
          style="width: 120px;"
        />
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
