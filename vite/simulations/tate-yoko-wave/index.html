<!doctype html>
<html lang="ja">
  <head>
    <title>縦横波</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>
  <body class="bg-neutral-900" oncontextmenu="return false;">
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a class="font-semibold text-white no-underline" href="https://bicpema.com/">Bicpema</a>
      <span class="ml-3 font-light text-neutral-300">縦横波</span>
    </nav>

    <div class="w-full" id="p5Container">
      <div id="p5Canvas"></div>
    </div>

    <!-- Bottom-left controls -->
    <div
      class="fixed bottom-0 start-0 m-3 flex items-center gap-2"
      style="z-index: 1000"
    >
      <button class="rounded bg-blue-600 px-3 py-2 text-white hover:bg-blue-500" id="moveBtn">スタート</button>
      <button class="rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500" id="resetBtn">リセット</button>
      <div
        class="flex items-center gap-2 rounded px-3 py-2"
        style="background: rgba(255, 255, 255, 0.15)"
      >
        <label class="mb-0 text-sm text-neutral-300" for="speedSlider">速度</label>
        <input
          type="range"
          class="accent-blue-600"
          id="speedSlider"
          min="10"
          max="60"
          step="1"
          value="30"
          style="width: 120px"
        />
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
