<!doctype html>
<html lang="ja">
  <head>
    <title>斜方投射</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 物理計算ロジックを先に読み込んだ後でシミュレーション本体を実行 -->
    <script type="module" src="./js/physics.js"></script>
  </head>

  <body class="m-0 h-screen w-screen p-0 fixed text-base">
    <div class="h-[10vh] bg-neutral-900 p-0">
      <div class="flex h-full items-center m-0">
        <a class="flex-1 text-center" href="https://bicpema.com/">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="2.5vw"
            fill="currentColor"
            class="bi bi-house-fill text-white"
            viewBox="0 0 16 16"
          >
            <path
              fill-rule="evenodd"
              d="m8 3.293 6 6V13.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5V9.293l6-6zm5-.793V6l-2-2V2.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5z"
            />
            <path
              fill-rule="evenodd"
              d="M7.293 1.5a1 1 0 0 1 1.414 0l6.647 6.646a.5.5 0 0 1-.708.708L8 2.207 1.354 8.854a.5.5 0 1 1-.708-.708L7.293 1.5z"
            />
          </svg>
        </a>
        <div class="p-0 flex-[10] text-center m-0">
          <span class="text-white" style="font-size: 2.5vw">斜方投射</span>
        </div>
        <div class="flex-1 text-center">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="2.5vw"
            fill="currentColor"
            class="bi bi-info-circle text-white"
            viewBox="0 0 16 16"
          >
            <path
              d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"
            />
            <path
              d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533L8.93 6.588zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"
            />
          </svg>
        </div>
      </div>
      <div class="p-0" id="p5Canvas"></div>
    </div>
    <!-- ローディングスピナー（p5.jsの初回draw()実行時にjs/index.jsで非表示にします） -->
    <div
      id="loadingSpinner"
      class="fixed inset-0 z-[2000] flex items-center justify-center bg-neutral-900"
      role="status"
      aria-live="polite"
      aria-label="読み込み中"
    >
      <div class="h-12 w-12 animate-spin rounded-full border-4 border-neutral-600 border-t-blue-500"></div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
