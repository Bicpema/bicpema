<!doctype html>
<html lang="ja">
  <head>
    <title>鉛直投げ下ろし運動</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body
    class="h-full overflow-hidden bg-neutral-900 p-0"
    oncontextmenu="return false;"
  >
    <bicpema-nav-bar></bicpema-nav-bar>

    <div
      class="relative mt-[60px] flex h-[calc(100vh-60px)] w-full flex-row overflow-hidden p-0 max-md:flex-col"
      id="p5Container"
    >
      <!-- 左：シミュレーション -->
      <div
        class="relative h-full flex-[0_0_60%] overflow-hidden bg-black max-md:flex-[0_0_55%]"
        id="simPanel"
      >
        <div class="flex h-full w-full justify-center" id="p5Canvas"></div>

        <!-- モーダルパネル -->
        <bicpema-settings-modal id="settingsModal" variant="dark">
          <div class="mb-3">
            <label for="heightInput" class="form-label">ボールの高さ (m)</label>
            <input
              type="number"
              class="form-control"
              id="heightInput"
              min="10"
              max="100"
              value="50"
              step="1"
            />
          </div>
          <div class="mb-3">
            <label for="initialVelocityInput" class="form-label"
              >初速度 (m/s)</label
            >
            <input
              type="number"
              class="form-control"
              id="initialVelocityInput"
              min="1"
              max="30"
              value="10"
              step="1"
            />
          </div>
        </bicpema-settings-modal>

        <!-- 左下コントロール -->
        <div
          class="absolute bottom-5 left-5 z-[1000] flex flex-wrap gap-2.5 max-[576px]:bottom-2.5 max-[576px]:left-2.5 max-[576px]:gap-2"
        >
          <button
            id="resetButton"
            class="rounded-lg bg-blue-600 px-5 py-2.5 text-base font-bold whitespace-nowrap text-white shadow-[0_4px_6px_rgba(0,0,0,0.3)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 hover:bg-blue-500 hover:shadow-[0_6px_8px_rgba(0,0,0,0.4)] active:translate-y-0 active:shadow-[0_2px_4px_rgba(0,0,0,0.3)] max-[576px]:px-[15px] max-[576px]:py-2 max-[576px]:text-sm max-[400px]:px-3 max-[400px]:py-1.5 max-[400px]:text-xs"
          >
            🔄 リセット
          </button>
          <button
            id="playPauseButton"
            class="rounded-lg bg-green-600 px-5 py-2.5 text-base font-bold whitespace-nowrap text-white shadow-[0_4px_6px_rgba(0,0,0,0.3)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 hover:bg-green-500 hover:shadow-[0_6px_8px_rgba(0,0,0,0.4)] active:translate-y-0 active:shadow-[0_2px_4px_rgba(0,0,0,0.3)] max-[576px]:px-[15px] max-[576px]:py-2 max-[576px]:text-sm max-[400px]:px-3 max-[400px]:py-1.5 max-[400px]:text-xs"
          >
            ▶ 開始
          </button>
        </div>

        <!-- 右上コントロール -->
        <bicpema-settings-button id="toggleModal"></bicpema-settings-button>
      </div>

      <!-- 右：グラフパネル -->
      <div
        class="flex flex-1 flex-col gap-2 overflow-hidden bg-[#1a1a2e] p-2 max-md:flex-row"
        id="graphPanel"
      >
        <div class="relative min-h-0 flex-1 rounded-lg bg-white/92 p-2">
          <canvas id="vtCanvas" class="block h-full w-full"></canvas>
        </div>
        <div class="relative min-h-0 flex-1 rounded-lg bg-white/92 p-2">
          <canvas id="ytCanvas" class="block h-full w-full"></canvas>
        </div>
      </div>
    </div>
    <!-- ローディングスピナー（p5.jsの初回draw()実行時にts/index.tsで非表示にします） -->
    <bicpema-loading-spinner></bicpema-loading-spinner>

    <script type="module" src="./ts/index.ts"></script>
  </body>
</html>
