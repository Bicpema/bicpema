<!doctype html>
<html lang="ja">
  <head>
    <title>作用反作用</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>

  <body class="bg-dark" oncontextmenu="return false;">
    <nav
      class="navbar navbar-expand-md bg-dark border-bottom border-bottom-dark fixed-top"
      data-bs-theme="dark"
      id="navBar"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="https://bicpema.com/">Bicpema</a>
        <span class="text-light fw-lighter">作用反作用</span>
      </div>
    </nav>

    <div class="container-fluid" id="p5Container">
      <div id="p5Canvas"></div>

      <!-- 設定パネル -->
      <div id="settingsModal" class="settings-modal" style="display: none">
        <div class="settings-content">
          <h5>設定</h5>
          <div class="mb-3">
            <label for="bookMassInput" class="form-label">
              本1冊の質量 m:
              <span id="bookMassDisplay">0.5</span> kg
            </label>
            <input
              type="range"
              class="form-range"
              id="bookMassInput"
              min="0.1"
              max="2.0"
              step="0.1"
              value="0.5"
            />
            <div class="d-flex justify-content-between">
              <small class="text-white-50">0.1 kg</small>
              <small class="text-white-50">2.0 kg</small>
            </div>
          </div>
          <button id="resetButton" class="btn btn-secondary w-100 mb-2">
            リセット
          </button>
          <button id="closeModal" class="btn btn-secondary w-100">
            閉じる
          </button>
        </div>
      </div>

      <!-- 右上コントロール -->
      <div class="right-top-controls">
        <button id="toggleModal" class="btn btn-info">⚙ 設定</button>
      </div>

      <!-- 左下コントロール -->
      <div class="bottom-left-controls">
        <button id="removeBookBtn" class="btn btn-danger me-2">− 本を削除</button>
        <button id="addBookBtn" class="btn btn-primary">＋ 本を追加</button>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
