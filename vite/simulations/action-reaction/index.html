<!doctype html>
<html lang="ja">
  <head>
    <title>作用反作用</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body
    class="h-full overflow-hidden bg-neutral-900 p-0"
    oncontextmenu="return false;"
  >
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a
        class="font-semibold text-white no-underline"
        href="https://bicpema.com/"
        >Bicpema</a
      >
      <span class="ml-3 font-light text-neutral-300">作用反作用</span>
    </nav>

    <div
      class="relative mt-[60px] h-[calc(100vh-60px)] w-full overflow-hidden p-0"
      id="p5Container"
    >
      <div class="flex h-full w-full justify-center" id="p5Canvas"></div>

      <!-- 設定パネル -->
      <div
        id="settingsModal"
        class="modal-panel hidden absolute top-1/2 left-1/2 max-h-[85vh] w-[360px] -translate-x-1/2 -translate-y-1/2 overflow-y-auto max-[576px]:w-[300px]"
        role="dialog"
        aria-modal="true"
        aria-label="設定"
      >
        <div>
          <h5 class="mb-4 text-center text-[1.1rem] text-white">設定</h5>

          <p class="mb-2 text-sm font-semibold text-white/80">
            表示する力の種類
          </p>
          <div class="mb-3 flex items-center gap-2">
            <input
              class="h-4 w-4 accent-red-500"
              type="checkbox"
              id="gravityCheckBox"
              checked
            />
            <label class="flex-1 text-sm" for="gravityCheckBox">
              <span class="inline-block h-2 w-6 align-middle bg-red-500"></span>
              重力（本にはたらく）
            </label>
          </div>
          <div class="mb-3 flex items-center gap-2">
            <input
              class="h-4 w-4 accent-blue-500"
              type="checkbox"
              id="normalCheckBox"
              checked
            />
            <label class="flex-1 text-sm" for="normalCheckBox">
              <span
                class="inline-block h-2 w-6 align-middle bg-blue-500"
              ></span>
              垂直抗力（本にはたらく）
            </label>
          </div>
          <div class="mb-3 flex items-center gap-2">
            <input
              class="h-4 w-4 accent-red-300"
              type="checkbox"
              id="earthReactionCheckBox"
              checked
            />
            <label class="flex-1 text-sm" for="earthReactionCheckBox">
              <span
                class="inline-block h-2 w-6 align-middle border-t-2 border-dashed border-red-300"
              ></span>
              地球を引く力（重力の反作用）
            </label>
          </div>
          <div class="mb-4 flex items-center gap-2">
            <input
              class="h-4 w-4 accent-blue-300"
              type="checkbox"
              id="normalReactionCheckBox"
              checked
            />
            <label class="flex-1 text-sm" for="normalReactionCheckBox">
              <span
                class="inline-block h-2 w-6 align-middle border-t-2 border-dashed border-blue-300"
              ></span>
              机・本を押す力（垂直抗力の反作用）
            </label>
          </div>

          <div class="mb-3 border-t border-white/20 pt-3">
            <label for="gravityInput" class="form-label text-sm">
              重力加速度 g: <span id="gravityDisplay">9.8</span> m/s²
            </label>
            <input
              type="range"
              class="w-full accent-cyan-500"
              id="gravityInput"
              min="1"
              max="20"
              step="0.1"
              value="9.8"
            />
          </div>
          <div class="mb-4">
            <label for="massInput" class="form-label text-sm">
              本1冊の質量: <span id="massDisplay">1.0</span> kg
            </label>
            <input
              type="range"
              class="w-full accent-cyan-500"
              id="massInput"
              min="0.2"
              max="3"
              step="0.1"
              value="1.0"
            />
          </div>

          <button
            id="clearBooksButton"
            class="mb-2 w-full rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500"
          >
            本をすべて取り除く
          </button>
          <button id="closeModal" class="modal-close modal-close-solid">
            閉じる
          </button>
        </div>
      </div>

      <!-- 左下コントロール -->
      <div
        class="absolute bottom-5 left-5 z-[1000] flex flex-wrap gap-2.5 max-[576px]:bottom-2.5 max-[576px]:left-2.5 max-[576px]:gap-2"
      >
        <button
          id="resetButton"
          class="rounded-lg bg-blue-600 px-5 py-2.5 text-base font-bold whitespace-nowrap text-white shadow-[0_4px_6px_rgba(0,0,0,0.3)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 hover:bg-blue-500 hover:shadow-[0_6px_8px_rgba(0,0,0,0.4)] active:translate-y-0 active:shadow-[0_2px_4px_rgba(0,0,0,0.3)] max-[576px]:px-[15px] max-[576px]:py-2 max-[576px]:text-sm max-[400px]:px-3 max-[400px]:py-1.5 max-[400px]:text-xs"
        >
          🔄 リセット
        </button>
        <button
          id="playPauseButton"
          class="rounded-lg bg-green-600 px-5 py-2.5 text-base font-bold whitespace-nowrap text-white shadow-[0_4px_6px_rgba(0,0,0,0.3)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 hover:bg-green-500 hover:shadow-[0_6px_8px_rgba(0,0,0,0.4)] active:translate-y-0 active:shadow-[0_2px_4px_rgba(0,0,0,0.3)] max-[576px]:px-[15px] max-[576px]:py-2 max-[576px]:text-sm max-[400px]:px-3 max-[400px]:py-1.5 max-[400px]:text-xs"
        >
          ▶ 再生
        </button>
      </div>

      <!-- 右上コントロール -->
      <div
        class="absolute top-5 right-5 z-[1000] max-[576px]:top-2.5 max-[576px]:right-2.5"
      >
        <button
          id="toggleModal"
          class="settings-modal-open btn-settings-modal-open"
          aria-label="シミュレーションの設定"
        >
          ⚙ 設定
        </button>
      </div>
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にjs/index.tsで非表示にします） -->
    <div
      id="loadingSpinner"
      class="fixed inset-0 z-[2000] flex items-center justify-center bg-neutral-900"
      role="status"
      aria-live="polite"
      aria-label="読み込み中"
    >
      <div
        class="h-12 w-12 animate-spin rounded-full border-4 border-neutral-600 border-t-blue-500"
      ></div>
    </div>

    <!-- TailwindCSS・p5.js は index.ts の import で読み込まれます -->
    <script type="module" src="./js/index.ts"></script>
  </body>
</html>
