<!doctype html>
<html lang="ja">
  <head>
    <title>作用反作用</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body
    class="h-full overflow-hidden bg-neutral-900 p-0"
    oncontextmenu="return false;"
  >
    <!--
      <bicpema-*> タグはビルド時に共通UIパーツのマークアップへ展開されます
      （vite/_build/bicpemaComponents.js）。DOM構造やスタイルを直接書かず、タグを利用してください。
    -->
    <bicpema-nav-bar></bicpema-nav-bar>

    <div
      class="relative mt-[60px] h-[calc(100vh-60px)] w-full overflow-hidden p-0"
      id="p5Container"
    >
      <div class="flex h-full w-full justify-center" id="p5Canvas"></div>

      <!-- 設定パネル -->
      <bicpema-settings-modal
        id="settingsModal"
        variant="dark"
        panel-class="w-[340px] max-[576px]:w-[290px]"
      >
        <p class="mb-2 text-sm font-bold">表示する力</p>
        <div class="mb-2 flex items-center gap-2">
          <input
            class="h-4 w-4 accent-blue-600"
            type="checkbox"
            id="showGravityCheckBox"
            checked
          />
          <label class="text-sm" for="showGravityCheckBox">重力</label>
        </div>
        <div class="mb-2 flex items-center gap-2">
          <input
            class="h-4 w-4 accent-blue-600"
            type="checkbox"
            id="showNormalCheckBox"
            checked
          />
          <label class="text-sm" for="showNormalCheckBox">垂直抗力</label>
        </div>
        <div class="mb-4 flex items-center gap-2">
          <input
            class="h-4 w-4 accent-blue-600"
            type="checkbox"
            id="showReactionCheckBox"
            checked
          />
          <label class="text-sm" for="showReactionCheckBox"
            >作用反作用の力（相手にはたらく力）</label
          >
        </div>
        <div class="mb-4 flex items-center gap-2">
          <input
            class="h-4 w-4 accent-blue-600"
            type="checkbox"
            id="showNumbersCheckBox"
            checked
          />
          <label class="text-sm" for="showNumbersCheckBox"
            >力の大きさ（N）を表示</label
          >
        </div>
        <div class="mb-3">
          <label for="gravityInput" class="form-label">
            重力加速度 g:
            <span id="gravityDisplay">9.8</span> m/s²
          </label>
          <input
            type="range"
            class="w-full accent-blue-600"
            id="gravityInput"
            min="1"
            max="20"
            step="0.1"
            value="9.8"
          />
          <div class="flex justify-between">
            <small class="text-white/50">1</small>
            <small class="text-white/50">20</small>
          </div>
        </div>
      </bicpema-settings-modal>

      <!-- 左下コントロール -->
      <div
        class="absolute bottom-5 left-5 z-[1000] flex flex-wrap gap-2.5 max-[576px]:bottom-2.5 max-[576px]:left-2.5 max-[576px]:gap-2"
      >
        <button
          id="resetButton"
          class="rounded-lg bg-blue-600 px-5 py-2.5 text-base font-bold whitespace-nowrap text-white shadow-[0_4px_6px_rgba(0,0,0,0.3)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 hover:bg-blue-500 hover:shadow-[0_6px_8px_rgba(0,0,0,0.4)] active:translate-y-0 active:shadow-[0_2px_4px_rgba(0,0,0,0.3)] max-[576px]:px-[15px] max-[576px]:py-2 max-[576px]:text-sm max-[400px]:px-3 max-[400px]:py-1.5 max-[400px]:text-xs"
        >
          🔄 リセット
        </button>
        <button
          id="playPauseButton"
          class="rounded-lg bg-green-600 px-5 py-2.5 text-base font-bold whitespace-nowrap text-white shadow-[0_4px_6px_rgba(0,0,0,0.3)] transition-[transform,box-shadow] duration-200 hover:-translate-y-0.5 hover:bg-green-500 hover:shadow-[0_6px_8px_rgba(0,0,0,0.4)] active:translate-y-0 active:shadow-[0_2px_4px_rgba(0,0,0,0.3)] max-[576px]:px-[15px] max-[576px]:py-2 max-[576px]:text-sm max-[400px]:px-3 max-[400px]:py-1.5 max-[400px]:text-xs"
        >
          ⏸ 一時停止
        </button>
      </div>

      <!-- 右上コントロール -->
      <bicpema-settings-button id="toggleModal"></bicpema-settings-button>
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にts/index.tsで非表示にします） -->
    <bicpema-loading-spinner></bicpema-loading-spinner>

    <!-- TailwindCSS・p5.js は index.ts の import で読み込まれます -->
    <script type="module" src="./ts/index.ts"></script>
  </body>
</html>
