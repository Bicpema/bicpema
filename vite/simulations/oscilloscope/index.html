<!doctype html>
<html lang="ja">
  <head>
    <title>音の可視化</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>
  <body class="bg-dark" oncontextmenu="return false;">
    <nav
      class="navbar navbar-expand-md bg-dark border-bottom border-bottom-dark fixed-top"
      data-bs-theme="dark"
      id="navBar"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="https://bicpema.com/">Bicpema</a>
        <span class="text-light fw-lighter">音の可視化</span>
      </div>
    </nav>

    <main class="container-fluid" id="p5Container">
      <div id="p5Canvas"></div>
      <div class="position-absolute bottom-0 start-0 m-3">
        <button class="btn btn-success m-1" id="startButton" type="button">音の入力開始</button>
        <button class="btn btn-secondary m-1" id="stopButton" type="button">一時停止</button>
        <button class="btn btn-secondary m-1" id="restartButton" type="button">再開</button>
      </div>
      <div class="position-absolute end-0 me-3" style="top: 4.2rem; z-index: 1100">
        <button
          class="btn btn-primary"
          data-bs-target="#simulationSettingModal"
          data-bs-toggle="modal"
          type="button"
        >表示設定</button>
      </div>
    </main>

    <div
      aria-hidden="true"
      aria-labelledby="simulationSettingModalLabel"
      class="modal fade"
      id="simulationSettingModal"
      tabindex="-1"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="simulationSettingModalLabel">表示設定</h1>
            <button aria-label="閉じる" class="btn-close" data-bs-dismiss="modal" type="button"></button>
          </div>
          <div class="modal-body">
            <label class="form-label" for="modeSelect">表示モード</label>
            <select class="form-select" id="modeSelect">
              <option value="waveform">波形</option>
              <option value="spectrum">スペクトル</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
