<!doctype html>
<html lang="ja">
  <head>
    <title>音の可視化</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body class="bg-neutral-900" oncontextmenu="return false;">
    <bicpema-nav-bar></bicpema-nav-bar>

    <main class="w-full p-0 mt-[60px]" id="p5Container">
      <div class="flex justify-center" id="p5Canvas"></div>
      <div class="absolute bottom-0 start-0 m-3">
        <button
          class="m-1 rounded bg-green-600 px-3 py-2 text-white hover:bg-green-500"
          id="startButton"
          type="button"
        >
          音の入力開始
        </button>
        <button
          class="m-1 rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500"
          id="stopButton"
          type="button"
        >
          一時停止
        </button>
        <button
          class="m-1 rounded bg-neutral-600 px-3 py-2 text-white hover:bg-neutral-500"
          id="restartButton"
          type="button"
        >
          再開
        </button>
      </div>
      <bicpema-settings-button
        class="absolute end-0 me-3 top-[4.2rem] z-[1100]"
      ></bicpema-settings-button>
    </main>

    <bicpema-settings-modal title="表示設定">
      <div>
        <label class="form-label" for="modeSelect">表示モード</label>
        <select class="form-control" id="modeSelect">
          <option value="waveform">波形</option>
          <option value="spectrum">スペクトル</option>
        </select>
      </div>
    </bicpema-settings-modal>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にts/index.tsで非表示にします） -->
    <bicpema-loading-spinner></bicpema-loading-spinner>

    <script type="module" src="./ts/index.ts"></script>
  </body>
</html>
