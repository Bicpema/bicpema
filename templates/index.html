<!doctype html>
<html lang="ja">
  <head>
    <title>{% title %}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body
    class="h-full overflow-hidden bg-neutral-900 p-0"
    oncontextmenu="return false;"
  >
    <nav
      class="fixed inset-x-0 top-0 z-50 flex h-[60px] items-center border-b border-neutral-700 bg-neutral-900 px-4"
      id="navBar"
    >
      <a
        class="font-semibold text-white no-underline"
        href="https://bicpema.com/"
        >Bicpema</a
      >
      <span class="ml-3 font-light text-neutral-300">{% title %}</span>
    </nav>

    <div
      class="relative mt-[60px] h-[calc(100vh-60px)] w-full overflow-hidden p-0"
      id="p5Container"
    >
      <div class="flex h-full w-full justify-center" id="p5Canvas"></div>

      <!-- <div id="graph" class="rounded border">
            <canvas id="graphCanvas"></canvas>
        </div> -->

      <!--
        左下の再生操作エリア（必要に応じてコメントアウトを外して利用してください）。
        js/init.jsで vite/js/bicpema-controls-controller.js の
        bindToggleControls()（開始/一時停止トグル）または
        bindStartStopControls()（開始・停止ボタンが別々のパターン）を使って
        イベント登録とaria-labelの付与を行ってください。
      <div class="absolute bottom-0 left-0 m-3 flex gap-2">
        <button type="button" class="cursor-pointer rounded bg-neutral-600 px-3 py-1.5 text-white hover:bg-neutral-500" id="playPauseButton">開始</button>
        <button type="button" class="cursor-pointer rounded bg-red-600 px-3 py-1.5 text-white hover:bg-red-500" id="resetButton">リセット</button>
      </div>
      -->

      <!-- 右上設定ボタン（必要に応じてコメントアウトを外して利用してください。開閉はjs/init.jsのinitModal()で行います） -->
      <!--
      <div class="absolute right-0 mr-3" style="top: 4.2rem; z-index: 1100">
        <button
          type="button"
          class="settings-modal-open rounded bg-blue-600 px-3 py-1.5 text-white hover:bg-blue-500"
          aria-label="シミュレーションの設定"
        >
          シミュレーションの設定
        </button>
      </div>
      -->
    </div>

    <!-- ローディングスピナー（p5.jsの初回draw()実行時にjs/index.tsで非表示にします） -->
    <div
      id="loadingSpinner"
      class="fixed inset-0 z-[2000] flex items-center justify-center bg-neutral-900"
      role="status"
      aria-live="polite"
      aria-label="読み込み中"
    >
      <div
        class="h-12 w-12 animate-spin rounded-full border-4 border-neutral-600 border-t-blue-500"
      ></div>
    </div>

    <!-- 設定モーダル（必要に応じてコメントアウトを外して利用してください。開閉はjs/init.jsのinitModal()で行います） -->
    <!--
    <div
      class="fixed inset-0 z-[1100] hidden flex items-center justify-center bg-black/50"
      id="simulationSettingModal"
      role="dialog"
      aria-modal="true"
      aria-label="シミュレーションの設定"
    >
      <div class="w-full max-w-lg rounded bg-white p-4 text-neutral-900">
        <div class="mb-3 flex items-center justify-between border-b border-neutral-200 pb-2">
          <h1 class="text-lg font-semibold">シミュレーションの設定</h1>
          <button
            type="button"
            class="modal-close text-xl leading-none text-neutral-500 hover:text-neutral-700"
            aria-label="Close"
          >
            &times;
          </button>
        </div>
        <div class="mb-3"></div>
        <div class="flex justify-end border-t border-neutral-200 pt-2">
          <button
            type="button"
            class="modal-close rounded border border-neutral-400 px-3 py-1.5 hover:bg-neutral-100"
          >
            閉じる
          </button>
        </div>
      </div>
    </div>
    -->

    <!-- TailwindCSS・p5.js は index.ts の import で読み込まれます -->
    <script type="module" src="./js/index.ts"></script>
  </body>
</html>
