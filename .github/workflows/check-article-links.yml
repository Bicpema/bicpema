name: 記事とシミュレーションのリンク整合性チェック

on:
  pull_request:
    paths:
      - "content/post/**"
      - "vite/simulations/**"
      - "scripts/check-article-simulation-links.js"
      - "scripts/articleless-simulation-allowlist.js"
      - "scripts/_lib/checkArticleSimulationLinks.js"
      - ".github/workflows/check-article-links.yml"
  push:
    branches:
      - main
    paths:
      - "content/post/**"
      - "vite/simulations/**"
      - "scripts/check-article-simulation-links.js"
      - "scripts/articleless-simulation-allowlist.js"
      - "scripts/_lib/checkArticleSimulationLinks.js"
      - ".github/workflows/check-article-links.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-article-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: 記事とシミュレーションのリンク整合性チェック
        run: npm run check:article-links
