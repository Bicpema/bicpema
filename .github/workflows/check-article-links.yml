name: 記事とシミュレーションのリンク整合性チェック

on:
  pull_request:
    paths:
      - "content/post/**"
      - "vite/simulations/**"
      - "scripts/check-article-simulation-links.js"
      - "scripts/articleless-simulation-allowlist.js"
      - "scripts/_lib/checkArticleSimulationLinks.js"
      - ".github/workflows/check-article-links.yml"
  push:
    branches:
      - main
    paths:
      - "content/post/**"
      - "vite/simulations/**"
      - "scripts/check-article-simulation-links.js"
      - "scripts/articleless-simulation-allowlist.js"
      - "scripts/_lib/checkArticleSimulationLinks.js"
      - ".github/workflows/check-article-links.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-article-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: 記事とシミュレーションのリンク整合性チェック
        run: npm run check:article-links
