---
name: 記事とシミュレーションのリンク整合性チェック

"on":
  pull_request:
    paths:
      - "content/post/**"
      - "vite/simulations/**"
      - "scripts/check-article-simulation-links.js"
      - "scripts/articleless-simulation-allowlist.js"
      - "scripts/_lib/checkArticleSimulationLinks.js"
      - ".github/workflows/check-article-links.yml"
      - ".github/actions/**"
  push:
    branches:
      - main
    paths:
      - "content/post/**"
      - "vite/simulations/**"
      - "scripts/check-article-simulation-links.js"
      - "scripts/articleless-simulation-allowlist.js"
      - "scripts/_lib/checkArticleSimulationLinks.js"
      - ".github/workflows/check-article-links.yml"
      - ".github/actions/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-article-links:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Node.jsのセットアップと依存パッケージのインストール
        uses: $/.github/actions/setup-node-deps

      - name: 記事とシミュレーションのリンク整合性チェック
        run: npm run check:article-links
