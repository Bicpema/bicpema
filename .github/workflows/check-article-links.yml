---
name: 記事とシミュレーションのリンク整合性チェック

"on":
  pull_request:
    paths:
      - "src/content/posts/**"
      - "vite/simulations/**"
      - "scripts/check-article-simulation-links.js"
      - "scripts/articleless-simulation-allowlist.js"
      - "scripts/_lib/checkArticleSimulationLinks.js"
      - ".github/workflows/check-article-links.yml"
  push:
    branches:
      - main
    paths:
      - "src/content/posts/**"
      - "vite/simulations/**"
      - "scripts/check-article-simulation-links.js"
      - "scripts/articleless-simulation-allowlist.js"
      - "scripts/_lib/checkArticleSimulationLinks.js"
      - ".github/workflows/check-article-links.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-article-links:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Node.jsのセットアップ
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: 依存パッケージのインストール
        run: npm ci

      - name: 記事とシミュレーションのリンク整合性チェック
        run: npm run check:article-links
