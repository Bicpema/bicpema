name: 記事とシミュレーションのリンク整合性チェック

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-article-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: 記事とシミュレーションのリンク整合性チェック
        run: npm run check:article-links
