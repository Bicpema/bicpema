---
name: TypeScriptの型チェック（tsc）

"on":
  pull_request:
    paths:
      - "vite/**"
      - "test/**"
      - "scripts/**"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/typecheck.yml"
      - ".github/actions/**"
  push:
    branches:
      - main
    paths:
      - "vite/**"
      - "test/**"
      - "scripts/**"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/typecheck.yml"
      - ".github/actions/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Node.jsのセットアップと依存パッケージのインストール
        uses: $/.github/actions/setup-node-deps

      - name: TypeScriptの型チェック
        run: npm run typecheck
