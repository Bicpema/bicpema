---
name: Firebase Hostingへのデプロイ

"on":
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true  # Hugoテーマを取得する
          fetch-depth: 0  # .GitInfo / .Lastmod のために全履歴を取得する

      - name: Hugoのセットアップ
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78  # v3.2.1
        with:
          hugo-version: "latest"
          extended: true

      - name: Node.jsのセットアップ
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: 依存パッケージのインストール
        run: npm ci

      - name: Viteのビルド
        run: npm run build

      - name: Hugoのビルド
        run: hugo --minify

      - name: Firebase Hostingへのデプロイ
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a  # v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BICPEMA }}"
          channelId: live
          projectId: bicpema
