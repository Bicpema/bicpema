---
name: Firebase Hostingへのデプロイ

"on":
  workflow_dispatch:

# 権限は最小限（リポジトリの読み取りのみ）にする。デプロイにはFirebaseのサービスアカウントを使うためGITHUB_TOKENの追加権限は不要
permissions:
  contents: read

# 本番への同時デプロイを避けるため直列化する。実行中のデプロイは中断しない
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # 対象コミットが品質チェックを通過した場合のみデプロイするため、デプロイ前にリント・型チェック・テストを実行する
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Node.jsのセットアップ
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: 依存パッケージのインストール
        run: npm ci

      - name: リント
        run: npm run lint

      - name: 型チェック
        run: npm run typecheck

      - name: ユニットテスト
        run: npm test

      - name: テンプレート準拠チェック
        run: npm run check:template-compliance

      - name: 記事とシミュレーションのリンク整合性チェック
        run: npm run check:article-links

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true  # Hugoテーマを取得する
          fetch-depth: 0  # .GitInfo / .Lastmod のために全履歴を取得する

      - name: Hugoのバージョンの取得
        id: hugo-version
        run: echo "version=$(tr -d '[:space:]' < .hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Hugoのセットアップ
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78  # v3.2.1
        with:
          hugo-version: ${{ steps.hugo-version.outputs.version }}
          extended: true

      - name: Node.jsのセットアップ
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: 依存パッケージのインストール
        run: npm ci

      - name: Viteのビルド
        run: npm run build

      - name: Hugoのビルド
        run: hugo --minify

      - name: Firebase Hostingへのデプロイ
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a  # v0
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BICPEMA }}"
          channelId: live
          projectId: bicpema
