name: 掲載URLのリンク切れチェック

# 教科書などに掲載されたURL（data/published-urls.yaml）がビルド成果物に存在するかを検査する。
# 記事・シミュレーション・レイアウト・設定など多くの変更がURLに影響しうるため、パスで絞り込まずに実行する。
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-published-urls:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # Hugoテーマを取得する
          fetch-depth: 0 # デプロイと同じく .GitInfo / .Lastmod のために全履歴を取得する

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Viteビルド
        run: npm run build

      - name: Hugoビルド
        run: hugo --minify

      - name: 掲載URLのリンク切れチェック
        run: npm run check:published-urls
