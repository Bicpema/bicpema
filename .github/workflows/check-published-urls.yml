---
name: 掲載URLのリンク切れチェック

# 教科書などに掲載されたURL（data/published-urls.yaml）がビルド成果物に存在するかを検査する。
# 記事・シミュレーション・レイアウト・設定など多くの変更がURLに影響しうるため、パスで絞り込まずに実行する。
"on":
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-published-urls:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: true  # Hugoテーマを取得する
          fetch-depth: 0  # デプロイと同じく .GitInfo / .Lastmod のために全履歴を取得する

      - name: Hugoのバージョンの取得
        id: hugo-version
        run: echo "version=$(tr -d '[:space:]' < .hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Hugoのセットアップ
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78  # v3.2.1
        with:
          hugo-version: ${{ steps.hugo-version.outputs.version }}
          extended: true

      - name: Node.jsのセットアップと依存パッケージのインストール
        uses: $/.github/actions/setup-node-deps

      - name: Viteのビルド
        run: npm run build

      - name: Hugoのビルド
        run: hugo --minify

      - name: 掲載URLのリンク切れチェック
        run: npm run check:published-urls
