name: Agent Skills 同期チェック

on:
  pull_request:
    paths:
      - ".github/skills/**"
      - ".github/agents/**"
      - ".claude/skills/**"
      - ".claude/agents/**"
      - "scripts/sync-claude-skills.mjs"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check .claude/skills and .claude/agents are in sync with .github
        run: node scripts/sync-claude-skills.mjs --check
