---
name: ドキュメント・コードのスペルチェック（cspell）

"on":
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.toml"
      - "**/*.html"
      - "i18n/**"
      - "scripts/**"
      - "vite/ts/**"
      - "cspell.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cspell.yml"
      - ".github/actions/**"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.toml"
      - "**/*.html"
      - "i18n/**"
      - "scripts/**"
      - "vite/ts/**"
      - "cspell.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cspell.yml"
      - ".github/actions/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cspell:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Node.jsのセットアップと依存パッケージのインストール
        uses: $/.github/actions/setup-node-deps

      - name: ドキュメント・コードのスペルチェック
        run: npm run lint:spell
