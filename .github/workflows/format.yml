---
name: コードのフォーマットチェック（Prettier）

# `prettier --check .` はリポジトリ全体（Markdown・YAML・JSON等を含む）が対象のため、パスで絞り込まずに実行する。
"on":
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Node.jsのセットアップと依存パッケージのインストール
        uses: $/.github/actions/setup-node-deps

      - name: コードのフォーマットチェック
        run: npm run format:check
