---
name: シミュレーションのテンプレート準拠チェック

"on":
  pull_request:
    paths:
      - "vite/simulations/**"
      - "vite/_templates/**"
      - "scripts/check-simulation-template-compliance.js"
      - "scripts/template-compliance-allowlist.js"
      - "scripts/_lib/checkSimulationTemplateCompliance.js"
      - ".github/workflows/check-template-compliance.yml"
  push:
    branches:
      - main
    paths:
      - "vite/simulations/**"
      - "vite/_templates/**"
      - "scripts/check-simulation-template-compliance.js"
      - "scripts/template-compliance-allowlist.js"
      - "scripts/_lib/checkSimulationTemplateCompliance.js"
      - ".github/workflows/check-template-compliance.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-template-compliance:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Node.jsのセットアップ
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: 依存パッケージのインストール
        run: npm ci

      - name: シミュレーションのテンプレート準拠チェック
        run: npm run check:template-compliance
