name: シミュレーションのテンプレート準拠チェック

on:
  pull_request:
    paths:
      - "templates/**"
      - "vite/simulations/**"
      - "scripts/check-simulation-template-compliance.js"
      - "scripts/template-compliance-allowlist.js"
      - "scripts/_lib/checkSimulationTemplateCompliance.js"
      - ".github/workflows/check-template-compliance.yml"
  push:
    branches:
      - main
    paths:
      - "templates/**"
      - "vite/simulations/**"
      - "scripts/check-simulation-template-compliance.js"
      - "scripts/template-compliance-allowlist.js"
      - "scripts/_lib/checkSimulationTemplateCompliance.js"
      - ".github/workflows/check-template-compliance.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-template-compliance:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: シミュレーションのテンプレート準拠チェック
        run: npm run check:template-compliance
