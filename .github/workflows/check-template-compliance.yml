name: シミュレーションのテンプレート準拠チェック

on:
  pull_request:
    paths:
      - "templates/**"
      - "vite/simulations/**"
      - "scripts/check-simulation-template-compliance.js"
      - "scripts/template-compliance-allowlist.js"
      - "scripts/_lib/checkSimulationTemplateCompliance.js"
      - ".github/workflows/check-template-compliance.yml"
  push:
    branches:
      - main
    paths:
      - "templates/**"
      - "vite/simulations/**"
      - "scripts/check-simulation-template-compliance.js"
      - "scripts/template-compliance-allowlist.js"
      - "scripts/_lib/checkSimulationTemplateCompliance.js"
      - ".github/workflows/check-template-compliance.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-template-compliance:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: シミュレーションのテンプレート準拠チェック
        run: npm run check:template-compliance
