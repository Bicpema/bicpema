---
name: シミュレーションの起動チェック（Playwright）

"on":
  pull_request:
    paths:
      - "vite/**"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-runtime.yml"
      - ".github/actions/**"
  push:
    branches:
      - main
    paths:
      - "vite/**"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-runtime.yml"
      - ".github/actions/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-runtime:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Node.jsのセットアップと依存パッケージのインストール
        uses: $/.github/actions/setup-node-deps

      - name: Viteのビルド
        run: npm run build

      - name: Playwrightブラウザーのキャッシュ
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Playwrightブラウザーのインストール
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwrightシステム依存パッケージのインストール
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: シミュレーションの起動チェック
        run: npm run verify:runtime
