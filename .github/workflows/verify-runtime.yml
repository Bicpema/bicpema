name: シミュレーション起動確認

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify-runtime:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: ビルド
        run: npm run build

      - name: Playwrightブラウザーのインストール
        run: npx playwright install --with-deps chromium

      - name: シミュレーション起動確認
        run: npm run verify:runtime
