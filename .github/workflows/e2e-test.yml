---
name: シミュレーションのE2Eテスト（Playwright）

"on":
  # PRでは変更されたシミュレーションのテストのみ実行する（全体のE2Eテストはタグ作成時・デプロイ時に実行する）
  # Requiredなステータスチェックでマージできなくなることを避けるため、パスフィルターではなくジョブ内で実行範囲を判定する
  pull_request:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-Beta*"
  # deploy.ymlからデプロイ前に全体のE2Eテストを実行するために呼び出す
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # PRの変更ファイルを判定するため全履歴を取得する
          persist-credentials: false

      - name: Node.jsのセットアップ
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: 依存パッケージのインストール
        run: npm ci

      # PR以外（タグ・デプロイ）は全テストを実行する
      - name: 実行するテストの判定
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            node scripts/detect-changed-tests.js "${BASE_SHA}" "${GITHUB_SHA}"
          else
            { echo "scope=all"; echo "run-e2e=true"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Playwrightブラウザーのインストール
        if: steps.detect.outputs.run-e2e == 'true'
        run: npx playwright install --with-deps chromium

      - name: シミュレーションのE2Eテスト（全体）
        if: steps.detect.outputs.scope == 'all'
        run: npm run test:e2e

      - name: シミュレーションのE2Eテスト（変更されたシミュレーションのみ）
        if: steps.detect.outputs.scope == 'simulations' && steps.detect.outputs.e2e-targets != ''
        env:
          TARGETS: ${{ steps.detect.outputs.e2e-targets }}
        run: |
          read -ra targets <<< "${TARGETS}"
          npm run test:e2e -- "${targets[@]}"

      - name: テストレポートのアップロード
        if: ${{ !cancelled() && steps.detect.outputs.run-e2e == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
