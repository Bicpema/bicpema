name: ユニットテスト

on:
  pull_request:
    paths:
      - "vite/**"
      - "vitest.config.js"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "vite/**"
      - "vitest.config.js"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: ユニットテスト
        run: npm test
