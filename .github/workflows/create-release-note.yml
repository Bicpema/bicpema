---
name: リリースノートの作成

on:
  # vX.X.X または vX.X.X-BetaX のタグがpushされたときに実行
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-Beta*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      # GitHub Release 作成のため
      contents: write
      # 別Workflowを起動するため
      actions: write

    steps:
      # リポジトリをcheckout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check prerelease
        id: prerelease
        run: |
          # タグ名に "Beta" が含まれている場合は prerelease と判定
          if [[ "${GITHUB_REF_NAME}" == *Beta* ]]; then
            echo "value=true" >> $GITHUB_OUTPUT
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        # GitHub Release を自動作成
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # PRやコミットからリリースノートを自動生成
          generate_release_notes: true
          # Betaの場合は prerelease にする
          prerelease: ${{ steps.prerelease.outputs.value }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Deploy Workflow
        # 正式リリースの場合のみデプロイWorkflowを起動
        if: steps.prerelease.outputs.value == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // デプロイ用Workflowを起動
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              // デプロイ対象のタグを指定
              ref: context.ref.replace('refs/tags/', ''),
            });
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
