---
version: 2
updates:
  # npm (JavaScript) の依存関係
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 50
    cooldown:
      default-days: 7
    labels:
      - "依存関係"

  # GitHub Actions の依存関係
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/workflows"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 50
    cooldown:
      default-days: 7
    labels:
      - "依存関係"
      - "github actions"
    # codeql-action の init と analyze は同じバージョンで揃える必要があるため、1つのPRにまとめる
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  # Python（yamllint 等の開発ツール）の依存関係
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 50
    cooldown:
      default-days: 7
    labels:
      - "依存関係"
