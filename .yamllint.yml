---
# yamllint の設定（https://yamllint.readthedocs.io/en/stable/configuration.html）
# YAMLの整形は Prettier ではなく yamllint で検査する（.prettierignore 参照）。
extends: default

ignore: |
  node_modules/
  public/vite/
  dist/
  .astro/
  docs/site/
  .claude/worktrees/

rules:
  # SHA固定の uses: 行（例: `uses: <action>@<SHA40桁>  # vX.Y.Z`）が80文字を超えるため緩和する
  line-length:
    max: 100
