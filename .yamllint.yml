# yamllint の設定（https://yamllint.readthedocs.io/en/stable/configuration.html）
# 整形は Prettier に任せ、Prettier と衝突するルールは無効化・緩和する。
extends: default

ignore: |
  node_modules/
  themes/
  public/
  resources/
  static/vite/
  docs/site/
  .claude/worktrees/

rules:
  # Prettier は "---" を付与しないため不要とする
  document-start: disable
  # 行長は Prettier の printWidth に任せる（SHA固定の uses: 行は80文字を超える）
  line-length: disable
  # Prettier はコメント前の空白を1つに整形する
  comments:
    min-spaces-from-content: 1
  # GitHub Actions の "on:" キーを誤検知しないよう、値のみを検査する
  truthy:
    check-keys: false
