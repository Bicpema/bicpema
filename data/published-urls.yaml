# 教科書などの外部出版物に掲載されているBicpemaのURL一覧。
# 掲載URLは出版物の改訂（約4年）まで変更できないため、ここに登録したURLがビルド成果物に
# 存在する（またはfirebase.jsonのリダイレクト先が存在する）ことを `npm run check:published-urls` とCIで検査する。
#
# 各エントリの項目:
#   url:          掲載されているURL（https://bicpema.com/ から始まる絶対URL）
#   publications: 掲載先の一覧（出版物名・掲載年度など）。未把握の場合は空配列とする
#     - name:     出版物名（例: ○○出版「物理基礎」）
#       year:     掲載年度（例: 2027）
#   note:         補足（任意）
#
# 現時点で掲載先を把握していないURLも、将来の掲載に備えてトップページと全シミュレーションを登録している。

